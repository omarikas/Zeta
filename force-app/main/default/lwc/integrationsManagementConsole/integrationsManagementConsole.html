<template>
    <section class="integrations-console">
        <header class="integrations-header">
            <div class="integrations-header-text">
                <h2 class="integrations-title">Integrations Management</h2>
                <p class="integrations-subtitle">
                    Monitor external data sources, master data providers, and platform connectors used across Pharma.
                </p>
            </div>
        </header>

        <section class="integrations-section">
            <h3 class="section-label">Core Integrations</h3>
            <div class="integrations-grid">
                <template for:each={primaryIntegrations} for:item="item">
                    <article key={item.id} class="integration-card">
                        <div class="integration-card-top">
                            <div class="integration-icon-panel">
                                <template if:true={item.logoUrl}>
                                    <img src={item.logoUrl} alt={item.name} class="integration-logo" />
                                </template>
                                <template if:false={item.logoUrl}>
                                    <lightning-icon icon-name={item.icon} size="small"></lightning-icon>
                                </template>
                            </div>
                            <span class={item.statusClass}>{item.status}</span>
                        </div>
                        <p class="integration-category">{item.category}</p>
                        <h4 class="integration-name">{item.name}</h4>
                        <p class="integration-desc">{item.description}</p>
                        <div class="integration-meta">
                            <span class="integration-sync-label">Last sync</span>
                            <span class="integration-sync-value">{item.lastSync}</span>
                        </div>
                        <template if:true={item.actionLabel}>
                            <lightning-button
                                label={item.actionLabel}
                                variant="brand"
                                class="integration-action"
                                data-integration-id={item.id}
                                onclick={handleAction}
                            ></lightning-button>
                        </template>
                    </article>
                </template>
            </div>
        </section>

        <section class="integrations-section">
            <h3 class="section-label">Additional &amp; Recommended</h3>
            <p class="section-hint">Common pharma integrations to plan for as the platform matures.</p>
            <div class="integrations-grid integrations-grid--compact">
                <template for:each={additionalIntegrations} for:item="item">
                    <article key={item.id} class="integration-card integration-card--compact">
                        <div class="integration-card-top">
                            <div class="integration-icon-panel integration-icon-panel--compact">
                                <lightning-icon icon-name={item.icon} size="x-small"></lightning-icon>
                            </div>
                            <span class={item.statusClass}>{item.status}</span>
                        </div>
                        <h4 class="integration-name">{item.name}</h4>
                        <p class="integration-desc">{item.description}</p>
                        <template if:true={item.actionLabel}>
                            <lightning-button
                                label={item.actionLabel}
                                variant="neutral"
                                class="integration-action"
                                data-integration-id={item.id}
                                onclick={handleAction}
                            ></lightning-button>
                        </template>
                    </article>
                </template>
            </div>
        </section>
    </section>
</template>
