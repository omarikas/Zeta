<template>
    <section class="template-manager">
        <header class="manager-header">
            <div class="manager-filters">
                <lightning-input
                    type="search"
                    label="Search quizzes"
                    value={searchTerm}
                    onchange={handleSearch}
                ></lightning-input>
                <lightning-combobox
                    label="Status"
                    value={activeFilter}
                    options={activeOptions}
                    onchange={handleActiveFilter}
                ></lightning-combobox>
            </div>
            <lightning-button label="New Quiz" variant="brand" onclick={handleNew}></lightning-button>
        </header>

        <template if:true={hasRows}>
            <table class="manager-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Parent</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.id}>
                            <td>{row.title}</td>
                            <td>{row.activeLabel}</td>
                            <td>{row.parentLabel}</td>
                            <td class="actions">
                                <lightning-button
                                    label="Edit Questions"
                                    data-id={row.id}
                                    onclick={handleEdit}
                                ></lightning-button>
                                <lightning-button
                                    label="Open Record"
                                    data-id={row.id}
                                    onclick={handleOpenRecord}
                                ></lightning-button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template if:false={hasRows}>
            <p class="empty">No quizzes found.</p>
        </template>

        <template if:true={hasSelectedQuiz}>
            <div class="editor-panel slds-m-top_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">Quiz Question Editor</h3>
                <c-quiz-question-editor record-id={selectedQuizId}></c-quiz-question-editor>
            </div>
        </template>
    </section>

    <template if:true={showNewModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">New Quiz</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Title" value={newTitle} onchange={handleNewTitle}></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseNew}></lightning-button>
                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Create"
                        disabled={isNewDisabled}
                        onclick={handleCreate}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
