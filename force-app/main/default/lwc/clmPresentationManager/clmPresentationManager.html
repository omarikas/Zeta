<template>
    <section class="presentation-manager">
        <header class="manager-header">
            <lightning-combobox
                label="Filter"
                value={statusFilter}
                options={statusOptions}
                onchange={handleStatusFilter}
            ></lightning-combobox>
            <lightning-button label="New Presentation" variant="brand" onclick={handleNew}></lightning-button>
        </header>

        <table class="manager-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Format</th>
                    <th>Product</th>
                    <th>Slides</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={rows} for:item="row">
                    <tr key={row.id}>
                        <td>{row.name}</td>
                        <td>{row.status}</td>
                        <td>{row.formatType}</td>
                        <td>
                            <div class="product-cell">
                                <c-product-thumbnail
                                    image-url={row.imageUrl}
                                    product-name={row.productName}
                                    size="sm"
                                ></c-product-thumbnail>
                                <span>{row.productName}</span>
                            </div>
                        </td>
                        <td>{row.slideCount}</td>
                        <td class="actions">
                            <lightning-button
                                label="Edit"
                                data-id={row.id}
                                onclick={handleEdit}
                            ></lightning-button>
                            <lightning-button
                                label="Deactivate"
                                data-id={row.id}
                                onclick={handleDeactivate}
                            ></lightning-button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <template if:true={showWizard}>
            <c-clm-presentation-wizard
                presentation-id={selectedPresentationId}
                onclose={handleWizardClose}
            ></c-clm-presentation-wizard>
        </template>
    </section>
</template>
