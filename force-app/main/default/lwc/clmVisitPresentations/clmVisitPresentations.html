<template>
    <section class="clm-visit-presentations">
        <header class="section-header">
            <h2 class="section-title">Presentations</h2>
            <p class="section-subtitle">Open a CLM presentation to capture slide time and feedback on this visit.</p>
            <template if:true={offlineHint}>
                <p class="offline-hint">{offlineHint}</p>
            </template>
        </header>

        <template if:true={showPlayer}>
            <c-clm-player
                visit-id={recordId}
                presentation-id={activePresentationId}
                presentation-name={activePresentationName}
                onclose={handlePlayerClose}
                onsessioncomplete={handleSessionComplete}
            ></c-clm-player>
        </template>

        <template if:true={showFeedbackForSession}>
            <article class="feedback-panel slds-m-bottom_medium">
                <h3 class="feedback-title">Capture Feedback</h3>
                <c-clm-message-feedback
                    session-id={activeSessionId}
                    onsaved={handleFeedbackSaved}
                    oncancel={handleFeedbackCancel}
                ></c-clm-message-feedback>
                <c-clm-ratings-capture
                    class="slds-m-top_medium"
                    visit-id={recordId}
                    session-id={activeSessionId}
                    onsaved={handleFeedbackSaved}
                ></c-clm-ratings-capture>
            </article>
        </template>

        <article class="panel">
            <h3 class="panel-title">Available Presentations</h3>
            <template if:true={hasPresentations}>
                <div class="card-grid">
                    <template for:each={presentationCards} for:item="pres">
                        <article key={pres.key} class="pres-card">
                            <h4>{pres.name}</h4>
                            <p class="meta">{pres.formatType} · {pres.slideCount} slides</p>
                            <p class="meta product-meta-row">
                                <c-product-thumbnail
                                    image-url={pres.imageUrl}
                                    product-name={pres.productName}
                                    size="sm"
                                ></c-product-thumbnail>
                                <span>Product: {pres.productName}</span>
                            </p>
                            <lightning-button
                                label="Open"
                                variant="brand"
                                data-id={pres.id}
                                data-name={pres.name}
                                onclick={handleOpenPresentation}
                                disabled={isLocked}
                            ></lightning-button>
                        </article>
                    </template>
                </div>
            </template>
            <template if:false={hasPresentations}>
                <p class="empty">No presentations are available for your territory.</p>
            </template>
        </article>

        <article class="panel">
            <h3 class="panel-title">Sessions on This Visit</h3>
            <template if:true={hasSessions}>
                <div class="session-list">
                    <template for:each={sessionCards} for:item="session">
                        <article key={session.key} class="session-card">
                            <div class="session-main">
                                <h4>{session.name}</h4>
                                <p class="meta">{session.slidesLabel} · {session.duration}</p>
                                <p class="meta">Status: {session.status}</p>
                            </div>
                            <template if:true={session.canFeedback}>
                                <lightning-button
                                    label="Feedback"
                                    data-id={session.id}
                                    onclick={handleOpenFeedback}
                                ></lightning-button>
                            </template>
                        </article>
                    </template>
                </div>
            </template>
            <template if:false={hasSessions}>
                <p class="empty">No presentation sessions logged yet.</p>
            </template>
        </article>
    </section>
</template>
