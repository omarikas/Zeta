<template>
    <section class="clm-activity-history">
        <header class="history-header">
            <div class="history-header-copy">
                <h2>Activity History</h2>
                <p>Visits, presentations, and products.</p>
            </div>
            <lightning-button
                label="Agent insights"
                icon-name="utility:einstein"
                variant="neutral"
                class="insights-trigger"
                onclick={handleOpenInsights}
            ></lightning-button>
        </header>

        <template if:true={hasHistory}>
            <template for:each={groupedHistory} for:item="group">
                <section key={group.key} class="date-group">
                    <h3 class="date-group-label">{group.label}</h3>
                    <ul class="slds-timeline timeline-list">
                        <template for:each={group.items} for:item="item">
                            <li key={item.key} class={item.timelineItemClass}>
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <div class={item.iconContainerClass} title={item.typeLabel}>
                                            <lightning-icon
                                                icon-name={item.timelineIconName}
                                                size="x-small"
                                                alternative-text={item.typeLabel}
                                            ></lightning-icon>
                                        </div>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-timeline__trigger">
                                            <article class={item.cardClass}>
                                                <button
                                                    type="button"
                                                    class="timeline-card-toggle"
                                                    data-key={item.key}
                                                    onclick={handleToggleExpand}
                                                    aria-expanded={item.isExpanded}
                                                >
                                                    <lightning-icon
                                                        icon-name={item.expandIcon}
                                                        size="xx-small"
                                                        class="expand-icon"
                                                    ></lightning-icon>
                                                    <div class="timeline-top">
                                                        <div class="timeline-titles">
                                                            <h4 class="timeline-title">{item.title}</h4>
                                                            <template if:true={item.subtitle}>
                                                                <p class="timeline-subtitle">{item.subtitle}</p>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </button>

                                                <div class="timeline-meta">
                                                    <span class="timeline-when">{item.whenLabel}</span>
                                                    <template if:true={item.ownerName}>
                                                        <span class="timeline-meta-part">· {item.ownerName}</span>
                                                    </template>
                                                    <template if:true={item.status}>
                                                        <span class="timeline-meta-part">· {item.status}</span>
                                                    </template>
                                                </div>

                                                <template if:true={item.isExpanded}>
                                                    <div class="timeline-body">
                                                        <template if:true={item.hasAddress}>
                                                            <p class="detail-row">
                                                                <span class="detail-label">Address</span>
                                                                <span class="detail-value">{item.address}</span>
                                                            </p>
                                                        </template>
                                                        <template if:true={item.hasChannel}>
                                                            <p class="detail-row">
                                                                <span class="detail-label">Channel</span>
                                                                <span class="detail-value">{item.channel}</span>
                                                            </p>
                                                        </template>

                                                        <template if:true={item.hasProducts}>
                                                            <div class="products-section">
                                                                <p class="section-label">Products Detailed</p>
                                                                <div class="timeline-products">
                                                                    <template for:each={item.products} for:item="product">
                                                                        <span key={product.productName} class="product-pill">
                                                                            <c-product-thumbnail
                                                                                image-url={product.imageUrl}
                                                                                product-name={product.productName}
                                                                                size="sm"
                                                                            ></c-product-thumbnail>
                                                                            <span class="product-pill-label">{product.productName}</span>
                                                                        </span>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <template if:true={item.hasPresentations}>
                                                            <div class="presentations-section">
                                                                <p class="section-label">Presentations</p>
                                                                <template for:each={item.presentations} for:item="pres">
                                                                    <article key={pres.key} class="presentation-card">
                                                                        <h5 class="presentation-name">{pres.presentationName}</h5>
                                                                        <p class="presentation-meta">{pres.slidesLabel}</p>
                                                                        <template if:true={pres.durationLabel}>
                                                                            <p class="presentation-meta">Duration {pres.durationLabel}</p>
                                                                        </template>
                                                                        <template if:true={pres.hasThumbnails}>
                                                                            <div class="slide-thumbnails" role="list">
                                                                                <template for:each={pres.slideThumbnails} for:item="thumb">
                                                                                    <figure key={thumb.key} class="slide-thumb" role="listitem">
                                                                                        <template if:true={thumb.hasImage}>
                                                                                            <img src={thumb.thumbnailUrl} alt={thumb.label} />
                                                                                        </template>
                                                                                        <template if:false={thumb.hasImage}>
                                                                                            <div class="slide-thumb-placeholder">
                                                                                                <lightning-icon icon-name="utility:image" size="x-small"></lightning-icon>
                                                                                            </div>
                                                                                        </template>
                                                                                        <figcaption>{thumb.label}</figcaption>
                                                                                    </figure>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </article>
                                                                </template>
                                                            </div>
                                                        </template>

                                                        <template if:true={item.hasDetails}>
                                                            <ul class="timeline-details">
                                                                <template for:each={item.detailLines} for:item="line">
                                                                    <li key={line} class="timeline-detail">{line}</li>
                                                                </template>
                                                            </ul>
                                                        </template>

                                                        <template if:true={item.isPrimary}>
                                                            <div class="record-link-row">
                                                                <button
                                                                    type="button"
                                                                    class="record-link"
                                                                    data-id={item.recordId}
                                                                    data-object={item.linkObjectApiName}
                                                                    onclick={handleOpenRecord}
                                                                >
                                                                    Open {item.typeLabel}
                                                                </button>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </article>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>
        </template>

        <template if:false={hasHistory}>
            <p class="empty">No activity recorded for this account yet.</p>
        </template>

        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                <span>{error}</span>
            </div>
        </template>
    </section>

    <template if:true={isInsightsModalOpen}>
        <div class="insights-modal-wrapper">
            <div class="insights-backdrop" role="presentation" onclick={handleCloseInsights}></div>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open insights-modal"
                aria-labelledby="insights-modal-heading"
                aria-modal="true"
            >
                <div class="slds-modal__container insights-modal-container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={handleCloseInsights}
                        >
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="insights-modal-heading" class="slds-modal__title slds-hyphenate">
                            <lightning-icon icon-name="utility:einstein" size="small" class="insights-modal-icon"></lightning-icon>
                            Agent insights
                        </h2>
                        <p class="insights-modal-subtitle">Summary across all historical visits for this account</p>
                    </header>

                    <div class="slds-modal__content insights-modal-content">
                        <template if:true={isInsightsLoading}>
                            <div class="insights-loading">
                                <lightning-spinner alternative-text="Generating insights" size="medium"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={isInsightsLoading}>
                            <template if:true={insightsError}>
                                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                                    <span>{insightsError}</span>
                                </div>
                            </template>

                            <template if:true={hasInsights}>
                                <template if:true={insightsSourceLabel}>
                                    <span class={insightsSourceClass}>{insightsSourceLabel}</span>
                                </template>

                                <section class="insights-section insights-section-featured">
                                    <h3 class="insights-section-title">{insights.headline}</h3>
                                    <p class="insights-summary">{insights.summary}</p>
                                    <p class="insights-stats">
                                        {insights.visitCount} visits · {insights.presentationCount} presentations
                                    </p>
                                </section>

                                <section class="insights-section">
                                    <h4 class="insights-label">Products discussed</h4>
                                    <template if:true={hasProductsDiscussed}>
                                        <ul class="insights-chip-list">
                                            <template for:each={insights.productsDiscussed} for:item="product">
                                                <li key={product} class="insights-chip">{product}</li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template if:false={hasProductsDiscussed}>
                                        <p class="insights-empty">No products recorded yet.</p>
                                    </template>
                                </section>

                                <section class="insights-section">
                                    <h4 class="insights-label">Pain points</h4>
                                    <template if:true={hasPainPoints}>
                                        <ul class="insights-bullet-list insights-bullet-pain">
                                            <template for:each={insights.painPoints} for:item="point">
                                                <li key={point}>{point}</li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template if:false={hasPainPoints}>
                                        <p class="insights-empty">No pain points identified.</p>
                                    </template>
                                </section>

                                <section class="insights-section">
                                    <h4 class="insights-label">Positive signals</h4>
                                    <template if:true={hasPositiveSignals}>
                                        <ul class="insights-bullet-list insights-bullet-positive">
                                            <template for:each={insights.positiveSignals} for:item="signal">
                                                <li key={signal}>{signal}</li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template if:false={hasPositiveSignals}>
                                        <p class="insights-empty">No positive signals recorded.</p>
                                    </template>
                                </section>

                                <section class="insights-section">
                                    <h4 class="insights-label">Customer feedback</h4>
                                    <template if:true={hasCustomerFeedback}>
                                        <ul class="insights-bullet-list">
                                            <template for:each={insights.customerFeedback} for:item="feedback">
                                                <li key={feedback}>{feedback}</li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template if:false={hasCustomerFeedback}>
                                        <p class="insights-empty">No visit notes captured.</p>
                                    </template>
                                </section>

                                <section class="insights-section insights-section-action">
                                    <h4 class="insights-label">Suggested talking points</h4>
                                    <template if:true={hasTalkingPoints}>
                                        <ul class="insights-action-list">
                                            <template for:each={insights.suggestedTalkingPoints} for:item="talkingPoint">
                                                <li key={talkingPoint}>{talkingPoint}</li>
                                            </template>
                                        </ul>
                                    </template>
                                </section>
                            </template>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" onclick={handleCloseInsights}></lightning-button>
                    </footer>
                </div>
            </section>
        </div>
    </template>
</template>
