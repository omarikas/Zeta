<template>
    <lightning-card title="Visit Insights" icon-name="standard:location">
        <div class="insights-panel">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading visit insights" size="small"></lightning-spinner>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:if={hasPlanTarget}>
            <article class="insight-card">
                <header class="card-header">
                    <lightning-icon icon-name="utility:trail" size="x-small" class="card-icon"></lightning-icon>
                    <h2 class="card-title">Visit Pace</h2>
                    <span class={frequencyBadgeClass}>{frequencyStatusLabel}</span>
                </header>
                <p class="pace-summary">{paceSummaryLabel}</p>
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-fill" style={progressStyle}></div>
                </div>
                <p class="gap-label">{gapLabel}</p>
            </article>

            <article class="insight-card">
                <header class="card-header">
                    <lightning-icon icon-name="utility:metrics" size="x-small" class="card-icon"></lightning-icon>
                    <h2 class="card-title">Month-End Outlook</h2>
                </header>
                <span class={paceStatusClass}>{paceStatusLabel}</span>
                <p class="detail-line">{projectionDetail}</p>
                <p class="detail-line muted">{committedDetail}</p>
            </article>

            <article class="insight-card">
                <header class="card-header">
                    <lightning-icon icon-name="utility:event" size="x-small" class="card-icon"></lightning-icon>
                    <h2 class="card-title">Planned Visits</h2>
                </header>
                <template lwc:if={hasFutureVisits}>
                    <ul class="visit-list">
                        <template for:each={futureVisits} for:item="visit">
                            <li key={visit.key} class="visit-item">
                                <button
                                    class="visit-link"
                                    type="button"
                                    data-visit-id={visit.id}
                                    onclick={handleOpenVisit}>
                                    <span class="visit-when">{visit.whenLabel}</span>
                                    <span class="visit-status">{visit.status}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="empty-hint">No upcoming draft or scheduled visits for this account.</p>
                </template>
            </article>
        </template>

        <template lwc:else>
            <article class="insight-card">
                <p class="empty-hint">This account is not in your current month plan cycle.</p>
            </article>
        </template>

        <article class="insight-card">
            <header class="card-header">
                <lightning-icon icon-name="utility:location" size="x-small" class="card-icon"></lightning-icon>
                <h2 class="card-title">Plan Together</h2>
            </header>

            <template lwc:if={isNeighborsLoading}>
                <lightning-spinner alternative-text="Loading nearby accounts" size="small"></lightning-spinner>
            </template>

            <template lwc:elseif={hasGeo}>
                <template lwc:if={showMap}>
                    <div class="map-container" lwc:dom="manual"></div>
                    <div class="map-legend slds-m-top_x-small">
                        <span class="legend-pin legend-pin-hcp"></span> HCP
                        <span class="legend-pin legend-pin-hco slds-m-left_small"></span> HCO
                        <span class={centerLegendPinClass}></span> {centerLegendLabel}
                    </div>
                </template>

                <template lwc:if={neighborRows.length}>
                    <p class="radius-hint">Showing incomplete plan targets within {searchRadiusKm} km.</p>
                    <ul class="neighbor-list">
                        <template for:each={paginatedNeighborRows} for:item="row">
                            <li key={row.key} class={row.rowClass}>
                                <lightning-input
                                    type="checkbox"
                                    label={row.name}
                                    checked={row.checked}
                                    disabled={row.disabled}
                                    data-account-id={row.accountId}
                                    onchange={handleNeighborToggle}>
                                </lightning-input>
                                <div class="neighbor-meta">
                                    <span>{row.gapLabel}</span>
                                    <span>{row.distanceLabel}</span>
                                </div>
                            </li>
                        </template>
                    </ul>

                    <template lwc:if={showNeighborPagination}>
                        <div class="pagination-bar">
                            <span class="pagination-range">{neighborRangeLabel}</span>
                            <div class="pagination-controls">
                                <button
                                    type="button"
                                    class="page-btn"
                                    onclick={handleNeighborPreviousPage}
                                    disabled={isNeighborPrevDisabled}>
                                    Previous
                                </button>
                                <span class="page-label">{neighborPageLabel}</span>
                                <button
                                    type="button"
                                    class="page-btn"
                                    onclick={handleNeighborNextPage}
                                    disabled={isNeighborNextDisabled}>
                                    Next
                                </button>
                            </div>
                        </div>
                    </template>

                    <template lwc:if={canMutateVisits}>
                        <div class="bulk-actions">
                            <lightning-input
                                type="date"
                                label="Visit date"
                                value={visitDate}
                                onchange={handleVisitDateChange}>
                            </lightning-input>
                            <lightning-button
                                variant="brand"
                                label={bulkButtonLabel}
                                onclick={handleBulkCreate}
                                disabled={bulkDisabled}
                                class="bulk-button">
                            </lightning-button>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="empty-hint">You can view nearby targets but do not have permission to create visits.</p>
                    </template>
                </template>
                <template lwc:else>
                    <p class="empty-hint">{neighborsEmptyMessage}</p>
                </template>
            </template>
            <template lwc:else>
                <p class="empty-hint">Add billing address geolocation to see nearby doctors on the map.</p>
            </template>
        </article>
    </div>
    </lightning-card>
</template>
