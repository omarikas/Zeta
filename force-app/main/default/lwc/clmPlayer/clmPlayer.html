<template>
    <section class="clm-player" role="dialog" aria-modal="true" aria-label="CLM Presentation Player">
        <header class="player-header">
            <button class="player-icon-btn" title="Close" onclick={handleCancel}>
                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
            </button>
            <div class="player-title-block">
                <h2 class="player-title">{presentationName}</h2>
                <p class="player-counter">{slideCounterLabel}</p>
            </div>
            <div class="player-header-actions">
                <button class="tracking-toggle" onclick={toggleTracking} disabled={isSessionLoading} title="Toggle tracking">
                    <lightning-icon
                        icon-name={trackingIconName}
                        size="x-small"
                        class="tracking-toggle-icon"
                    ></lightning-icon>
                    <span>{trackingToggleLabel}</span>
                </button>
            </div>
        </header>

        <template if:true={showOfflineBanner}>
            <div class="offline-banner" role="status">
                <lightning-icon icon-name="utility:offline" size="xx-small"></lightning-icon>
                <span>Offline — metrics will sync when connected</span>
            </div>
        </template>

        <div class="player-stage">
            <template if:true={showStageSpinner}>
                <div class="stage-loading">
                    <div class="stage-loading-card">
                        <div class="stage-loading-spinner" role="status" aria-label={stageLoadingLabel}></div>
                        <p class="stage-loading-label">{stageLoadingLabel}</p>
                    </div>
                </div>
            </template>
            <template if:true={showPauseOverlay}>
                <div class="pause-overlay">
                    <div class="pause-overlay-card">
                        <lightning-icon icon-name="utility:pause" size="small"></lightning-icon>
                        <span>Tracking Paused</span>
                    </div>
                </div>
            </template>
            <template if:true={pdfLoadError}>
                <article class="slide-error" role="alert">
                    <lightning-icon icon-name="utility:error" size="small" class="slide-error-icon"></lightning-icon>
                    <h3>Unable to load slide</h3>
                    <p>{pdfLoadError}</p>
                    <lightning-button
                        label="Retry"
                        variant="brand"
                        onclick={handleRetryPdfLoad}
                    ></lightning-button>
                </article>
            </template>
            <template if:true={htmlLoadError}>
                <article class="slide-error" role="alert">
                    <lightning-icon icon-name="utility:error" size="small" class="slide-error-icon"></lightning-icon>
                    <h3>Unable to load HTML presentation</h3>
                    <p>{htmlLoadError}</p>
                    <lightning-button
                        label="Retry"
                        variant="brand"
                        onclick={handleRetryHtmlLoad}
                    ></lightning-button>
                </article>
            </template>
            <div class="slide-frame">
                <template if:true={currentSlideUrl}>
                    <img
                        class="slide-image"
                        class:slide-image-hidden={showStageSpinner}
                        src={currentSlideUrl}
                        alt={currentSequence.sequenceName}
                        onload={handleSlideImageLoad}
                        onerror={handleSlideImageError}
                    />
                </template>
                <template if:true={showPdfCanvas}>
                    <canvas
                        class="slide-pdf-canvas"
                        title={currentSequence.sequenceName}
                    ></canvas>
                </template>
                <template if:true={showNativePdfViewer}>
                    <iframe
                        class="slide-pdf-frame"
                        title={currentSequence.sequenceName}
                        src={pdfViewerSrc}
                        onload={handleNativePdfLoad}
                    ></iframe>
                </template>
                <template if:true={showHtmlViewer}>
                    <iframe
                        class="slide-html-frame"
                        title={currentSequence.sequenceName}
                        src={htmlFrameUrl}
                        onload={handleHtmlFrameLoad}
                    ></iframe>
                </template>
                <template if:true={showPlaceholder}>
                    <article class="slide-placeholder">
                        <h3>{currentSequence.sequenceName}</h3>
                        <template if:true={currentSequence.messageNames}>
                            <p class="slide-meta">Messages: {currentSequence.messageNames}</p>
                        </template>
                        <template if:true={currentSequence.productNames}>
                            <p class="slide-meta">Products: {currentSequence.productNames}</p>
                        </template>
                    </article>
                </template>
                <template if:true={hasSlideMessages}>
                    <button
                        class={slideMessageButtonClass}
                        type="button"
                        onclick={handleOpenMessageCapture}
                        title={slideMessageButtonLabel}
                    >
                        <lightning-icon icon-name="utility:comments" size="x-small"></lightning-icon>
                        <span>{slideMessageButtonLabel}</span>
                    </button>
                </template>
            </div>
            <template if:true={showMessageOverlay}>
                <div class="message-overlay-backdrop">
                    <article class="message-overlay" role="dialog" aria-modal="true" aria-label="Capture message response">
                        <header class="message-overlay-header">
                            <h3>Capture Message Response</h3>
                            <p>How did {overlayProductName} land for this message?</p>
                        </header>
                        <template for:each={overlayMessagesWithOptions} for:item="message">
                            <section key={message.key} class="message-overlay-row">
                                <p class="message-overlay-label">{message.messageName}</p>
                                <div class="message-overlay-sentiments">
                                    <template for:each={message.options} for:item="option">
                                        <button
                                            key={option.key}
                                            class={option.className}
                                            type="button"
                                            data-name={message.messageName}
                                            data-sentiment={option.value}
                                            title={option.label}
                                            aria-label={option.label}
                                            onclick={handleOverlaySentimentChange}
                                        >
                                            <span class="message-sentiment-emoji" aria-hidden="true">{option.emoji}</span>
                                            <span class="message-sentiment-text">{option.label}</span>
                                        </button>
                                    </template>
                                </div>
                            </section>
                        </template>
                        <footer class="message-overlay-actions">
                            <lightning-button
                                label="Cancel"
                                onclick={handleMessageOverlayCancel}
                                disabled={isSavingMessageResponse}
                            ></lightning-button>
                            <lightning-button
                                label="Save"
                                variant="brand"
                                onclick={handleMessageOverlaySave}
                                disabled={isMessageOverlaySaveDisabled}
                            ></lightning-button>
                        </footer>
                    </article>
                </div>
            </template>
        </div>

        <footer class="player-footer">
            <div class="thumb-strip" role="tablist" aria-label="Slide thumbnails">
                <template for:each={thumbnailItems} for:item="thumb">
                    <button
                        key={thumb.key}
                        class={thumb.className}
                        data-index={thumb.index}
                        onclick={handleThumbClick}
                        title={thumb.label}
                        disabled={isSessionLoading}
                        role="tab"
                        aria-selected={thumb.isActive}
                    >
                        <template if:true={thumb.url}>
                            <img src={thumb.url} alt={thumb.label} loading="lazy" />
                        </template>
                        <template if:false={thumb.url}>
                            <span class="thumb-page-label">{thumb.pageLabel}</span>
                        </template>
                    </button>
                </template>
            </div>
            <div class="player-controls">
                <lightning-button
                    label="Previous"
                    icon-name="utility:chevronleft"
                    onclick={handlePrevious}
                    disabled={isPreviousDisabled}
                ></lightning-button>
                <lightning-button
                    label="Next"
                    icon-name="utility:chevronright"
                    icon-position="right"
                    onclick={handleNext}
                    disabled={isNextDisabled}
                ></lightning-button>
                <lightning-button
                    label="Complete"
                    variant="brand"
                    onclick={handleComplete}
                    disabled={isCompleteDisabled}
                ></lightning-button>
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
            </div>
        </footer>
    </section>
</template>
