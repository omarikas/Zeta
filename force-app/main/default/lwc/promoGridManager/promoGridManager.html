<template>
    <section class="promo-grid-console">
        <header class="console-header">
            <div class="console-header-text">
                <p class="console-subtitle">
                    Configure product weights, specialty focus, and class targeting for each Line territory.
                    Product weights should total 100%. The meter updates as you edit.
                </p>
            </div>
        </header>

        <div class="console-panels">
            <section class="panel panel-lines">
                <div class="panel-heading">
                    <h3>Line Territories</h3>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        label="Search lines"
                        placeholder="Search lines..."
                        value={lineSearchTerm}
                        onchange={handleLineSearch}
                    ></lightning-input>
                </div>

                <template if:true={hasLines}>
                    <ul class="line-list" role="listbox" aria-label="Line territories">
                        <template for:each={filteredLines} for:item="line">
                            <li key={line.id} class={line.rowClass} role="option" aria-selected={line.isSelected}>
                                <div class="line-row-inner" style={line.depthStyle}>
                                    <template if:true={line.hasChildren}>
                                        <button
                                            class="toggle-btn"
                                            type="button"
                                            data-id={line.id}
                                            onclick={handleToggle}
                                            title="Expand or collapse"
                                        >
                                            <lightning-icon
                                                icon-name={line.chevronIcon}
                                                size="x-small"
                                            ></lightning-icon>
                                        </button>
                                    </template>
                                    <template if:false={line.hasChildren}>
                                        <span class="toggle-spacer"></span>
                                    </template>
                                    <button
                                        class={line.selectBtnClass}
                                        type="button"
                                        data-id={line.id}
                                        data-name={line.name}
                                        data-is-line={line.isLine}
                                        onclick={handleLineSelect}
                                        disabled={line.selectDisabled}
                                        title={line.selectTitle}
                                    >
                                        <span class="line-labels">
                                            <span class="line-name">{line.name}</span>
                                            <span class="line-meta">
                                                <span class="level-badge">{line.level}</span>
                                                <span class={line.vacantClass}>{line.vacantLabel}</span>
                                                <template if:true={line.isLine}>
                                                    <span class={line.badgeClass}>{line.weightBadge}</span>
                                                </template>
                                            </span>
                                        </span>
                                    </button>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false={hasLines}>
                    <div class="empty-state">
                        <p>No territories found. Seed the territory hierarchy first.</p>
                    </div>
                </template>
            </section>

            <section class="panel panel-detail">
                <div class="panel-heading panel-heading--row">
                    <div>
                        <h3>{detailTitle}</h3>
                        <p class="panel-caption">Manage the three Promo Grid related lists for this Line.</p>
                    </div>
                </div>

                <template if:true={hasSelectedLine}>
                    <div class="tabs" role="tablist">
                        <button class={weightsTabClass} data-tab="weights" onclick={handleTabClick} role="tab">
                            Product Weights
                        </button>
                        <button class={specialtyTabClass} data-tab="specialty" onclick={handleTabClick} role="tab">
                            Specialty Focus
                        </button>
                        <button class={classTabClass} data-tab="class" onclick={handleTabClick} role="tab">
                            Class Targeting
                        </button>
                    </div>

                    <template if:true={isWeightsTab}>
                        <div class={weightMeter.stripClass}>
                            <div class="meter-meta">
                                <strong>Total: {weightMeter.totalLabel}</strong>
                                <span>{weightMeter.statusLabel}</span>
                            </div>
                            <div class="meter-track" aria-hidden="true">
                                <div class={weightMeter.barClass} style={weightMeter.barStyle}></div>
                            </div>
                        </div>

                        <div class="section-actions">
                            <lightning-button
                                label="Add Product Weight"
                                variant="brand"
                                onclick={handleNewWeight}
                                disabled={isSaving}
                            ></lightning-button>
                        </div>

                        <template if:true={hasProductWeights}>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Weight</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={productWeights} for:item="row">
                                        <tr key={row.id}>
                                            <td>{row.productName}</td>
                                            <td>{row.weightLabel}</td>
                                            <td class="row-actions">
                                                <lightning-button-icon
                                                    icon-name="utility:edit"
                                                    alternative-text="Edit"
                                                    title="Edit"
                                                    data-id={row.id}
                                                    onclick={handleEditWeight}
                                                ></lightning-button-icon>
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Delete"
                                                    title="Delete"
                                                    data-id={row.id}
                                                    onclick={handleDeleteWeight}
                                                ></lightning-button-icon>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasProductWeights}>
                            <div class="empty-state">
                                <p>No product weights yet. Add products until weights total 100%.</p>
                            </div>
                        </template>
                    </template>

                    <template if:true={isSpecialtyTab}>
                        <div class={specialtyMeter.stripClass}>
                            <div class="meter-meta">
                                <strong>Total: {specialtyMeter.totalLabel}</strong>
                                <span>{specialtyMeter.statusLabel}</span>
                            </div>
                            <div class="meter-track" aria-hidden="true">
                                <div class={specialtyMeter.barClass} style={specialtyMeter.barStyle}></div>
                            </div>
                        </div>

                        <div class="section-actions">
                            <lightning-button
                                label="Add Specialty Focus"
                                variant="brand"
                                onclick={handleNewSpecialty}
                                disabled={isSaving}
                            ></lightning-button>
                        </div>

                        <template if:true={hasSpecialtyFocus}>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Specialty</th>
                                        <th>List %</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={specialtyFocus} for:item="row">
                                        <tr key={row.id}>
                                            <td>{row.specialtyLabel}</td>
                                            <td>{row.percentageLabel}</td>
                                            <td class="row-actions">
                                                <lightning-button-icon
                                                    icon-name="utility:edit"
                                                    alternative-text="Edit"
                                                    title="Edit"
                                                    data-id={row.id}
                                                    onclick={handleEditSpecialty}
                                                ></lightning-button-icon>
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Delete"
                                                    title="Delete"
                                                    data-id={row.id}
                                                    onclick={handleDeleteSpecialty}
                                                ></lightning-button-icon>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasSpecialtyFocus}>
                            <div class="empty-state">
                                <p>No specialty focus rows yet.</p>
                            </div>
                        </template>
                    </template>

                    <template if:true={isClassTab}>
                        <div class={classMeter.stripClass}>
                            <div class="meter-meta">
                                <strong>Total: {classMeter.totalLabel}</strong>
                                <span>{classMeter.statusLabel}</span>
                            </div>
                            <div class="meter-track" aria-hidden="true">
                                <div class={classMeter.barClass} style={classMeter.barStyle}></div>
                            </div>
                        </div>

                        <div class="section-actions">
                            <lightning-button
                                label="Add Class Targeting"
                                variant="brand"
                                onclick={handleNewClass}
                                disabled={isSaving}
                            ></lightning-button>
                        </div>

                        <template if:true={hasClassTargeting}>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Class</th>
                                        <th>List %</th>
                                        <th>Target Monthly Visits</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={classTargeting} for:item="row">
                                        <tr key={row.id}>
                                            <td>{row.classCode}</td>
                                            <td>{row.percentageLabel}</td>
                                            <td>{row.visitsLabel}</td>
                                            <td class="row-actions">
                                                <lightning-button-icon
                                                    icon-name="utility:edit"
                                                    alternative-text="Edit"
                                                    title="Edit"
                                                    data-id={row.id}
                                                    onclick={handleEditClass}
                                                ></lightning-button-icon>
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Delete"
                                                    title="Delete"
                                                    data-id={row.id}
                                                    onclick={handleDeleteClass}
                                                ></lightning-button-icon>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasClassTargeting}>
                            <div class="empty-state">
                                <p>No class targeting rows yet.</p>
                            </div>
                        </template>
                    </template>
                </template>

                <template if:false={hasSelectedLine}>
                    <div class="empty-state">
                        <p>Select a Line territory to manage its Promo Grid.</p>
                    </div>
                </template>
            </section>
        </div>
    </section>

    <template if:true={showWeightModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">{weightModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class={weightMeter.stripClass}>
                        <div class="meter-meta">
                            <strong>Projected total: {weightMeter.totalLabel}</strong>
                            <span>{weightMeter.statusLabel}</span>
                        </div>
                        <div class="meter-track" aria-hidden="true">
                            <div class={weightMeter.barClass} style={weightMeter.barStyle}></div>
                        </div>
                        <p class="impact-hint">{weightDraftImpactLabel}</p>
                    </div>
                    <lightning-input
                        type="search"
                        label="Search products"
                        value={productSearchTerm}
                        onchange={handleWeightProductSearch}
                        class="slds-m-bottom_small"
                    ></lightning-input>
                    <lightning-combobox
                        label="Product"
                        value={draftWeight.product2Id}
                        options={productOptions}
                        onchange={handleWeightProductChange}
                        required
                    ></lightning-combobox>
                    <lightning-input
                        type="number"
                        label="Weight Percentage"
                        value={draftWeight.weightPercentage}
                        min="0"
                        max="100"
                        step="0.1"
                        onchange={handleWeightPercentageChange}
                        required
                        class="slds-m-top_small"
                    ></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseWeightModal}></lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handleSaveWeight}
                        disabled={isSaving}
                        class="slds-m-left_small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showSpecialtyModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">{specialtyModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class={specialtyMeter.stripClass}>
                        <div class="meter-meta">
                            <strong>Projected total: {specialtyMeter.totalLabel}</strong>
                            <span>{specialtyMeter.statusLabel}</span>
                        </div>
                        <div class="meter-track" aria-hidden="true">
                            <div class={specialtyMeter.barClass} style={specialtyMeter.barStyle}></div>
                        </div>
                        <p class="impact-hint">{specialtyDraftImpactLabel}</p>
                    </div>
                    <lightning-combobox
                        label="Specialty"
                        value={draftSpecialty.specialty}
                        options={specialtyOptions}
                        onchange={handleSpecialtyChange}
                        required
                    ></lightning-combobox>
                    <lightning-input
                        type="number"
                        label="List Percentage"
                        value={draftSpecialty.listPercentage}
                        min="0"
                        max="100"
                        step="0.1"
                        onchange={handleSpecialtyPercentageChange}
                        required
                        class="slds-m-top_small"
                    ></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseSpecialtyModal}></lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handleSaveSpecialty}
                        disabled={isSaving}
                        class="slds-m-left_small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showClassModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">{classModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class={classMeter.stripClass}>
                        <div class="meter-meta">
                            <strong>Projected total: {classMeter.totalLabel}</strong>
                            <span>{classMeter.statusLabel}</span>
                        </div>
                        <div class="meter-track" aria-hidden="true">
                            <div class={classMeter.barClass} style={classMeter.barStyle}></div>
                        </div>
                        <p class="impact-hint">{classDraftImpactLabel}</p>
                    </div>
                    <lightning-combobox
                        label="Class"
                        value={draftClass.classCode}
                        options={classOptions}
                        onchange={handleClassChange}
                        required
                    ></lightning-combobox>
                    <lightning-input
                        type="number"
                        label="List Percentage"
                        value={draftClass.listPercentage}
                        min="0"
                        max="100"
                        step="0.1"
                        onchange={handleClassPercentageChange}
                        required
                        class="slds-m-top_small"
                    ></lightning-input>
                    <lightning-input
                        type="number"
                        label="Target Monthly Visits"
                        value={draftClass.targetMonthlyVisits}
                        min="0"
                        step="1"
                        onchange={handleClassVisitsChange}
                        class="slds-m-top_small"
                    ></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseClassModal}></lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handleSaveClass}
                        disabled={isSaving}
                        class="slds-m-left_small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
