<template>
    <div class="wrap">
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Accounts</span>
                <span class="stat-value">{accountCount}</span>
            </div>
            <div class="stat">
                <span class="stat-label">Affiliations</span>
                <span class="stat-value">{affiliationCount}</span>
            </div>
            <lightning-button label="Refresh counts" onclick={refreshCounts} disabled={isBusy}></lightning-button>
        </div>

        <div class="tabs">
            <template for:each={tabs} for:item="tab">
                <button key={tab.id} class={tab.className} data-tab-id={tab.id} onclick={handleTabClick}>
                    {tab.label}
                </button>
            </template>
        </div>

        <template if:true={isLoadTab}>
            <div class="panel">
                <p class="help">
                    Wipe all Accounts and affiliations, then load Organizations (HCOs + clinics) and Doctors (HCPs).
                    Doctor clinic rows become Clinic HCOs; Practice affiliations link each doctor to their clinic(s).
                </p>
                <div class="file-row">
                    <lightning-input
                        type="file"
                        label="Zeta Organizations.xlsx"
                        accept=".xlsx,.xls"
                        onchange={handleOrgFile}
                    ></lightning-input>
                    <span class="file-name">{orgFileName}</span>
                    <span class="file-meta" if:true={hasOrgRows}>{orgRowCount} rows</span>
                </div>
                <div class="file-row">
                    <lightning-input
                        type="file"
                        label="Zeta Doctors.xlsx"
                        accept=".xlsx,.xls"
                        onchange={handleDoctorFile}
                    ></lightning-input>
                    <span class="file-name">{doctorFileName}</span>
                    <span class="file-meta" if:true={hasDoctorRows}>{doctorRowCount} rows</span>
                </div>
                <lightning-input
                    type="checkbox"
                    label="Scan for name + location duplicates during load"
                    checked={checkDuplicates}
                    onchange={handleCheckDuplicatesChange}
                ></lightning-input>
                <div class="actions">
                    <lightning-button
                        variant="destructive"
                        label="Wipe &amp; Load"
                        onclick={handleWipeAndLoad}
                        disabled={wipeDisabled}
                        class="wipe-btn"
                    ></lightning-button>
                </div>
                <template if:true={isBusy}>
                    <div class="progress">
                        <div class="progress-bar" style={progressStyle}></div>
                    </div>
                    <p class="progress-msg">{progressMessage}</p>
                </template>
                <template if:true={loadSummary}>
                    <p class="summary">{loadSummary}</p>
                </template>
            </div>
        </template>

        <template if:true={isModifyTab}>
            <div class="panel">
                <p class="help">
                    Upsert Accounts by External ID without wiping. Upload one or both workbooks, then Import.
                </p>
                <div class="file-row">
                    <lightning-input
                        type="file"
                        label="Organizations (optional)"
                        accept=".xlsx,.xls"
                        onchange={handleOrgFile}
                    ></lightning-input>
                    <span class="file-meta" if:true={hasOrgRows}>{orgRowCount} org rows</span>
                </div>
                <div class="file-row">
                    <lightning-input
                        type="file"
                        label="Doctors (optional)"
                        accept=".xlsx,.xls"
                        onchange={handleDoctorFile}
                    ></lightning-input>
                    <span class="file-meta" if:true={hasDoctorRows}>{doctorRowCount} doctor rows</span>
                </div>
                <lightning-input
                    type="checkbox"
                    label="Scan for name + location duplicates"
                    checked={checkDuplicates}
                    onchange={handleCheckDuplicatesChange}
                ></lightning-input>
                <div class="actions">
                    <lightning-button
                        variant="brand"
                        label="Import / Modify"
                        onclick={handleModifyImport}
                        disabled={isBusy}
                    ></lightning-button>
                </div>
                <template if:true={isBusy}>
                    <div class="progress">
                        <div class="progress-bar" style={progressStyle}></div>
                    </div>
                    <p class="progress-msg">{progressMessage}</p>
                </template>
                <template if:true={loadSummary}>
                    <p class="summary">{loadSummary}</p>
                </template>
            </div>
        </template>

        <template if:true={isBusinessUnitsTab}>
            <div class="panel">
                <p class="help">
                    Link Accounts to organogram Business Units (TERR_BU_* only). Potentiality A/B/C;
                    Propensity 1/2/3. Deactivate hides links from MR chips; history is kept.
                </p>
                <lightning-input
                    type="search"
                    label="Search account (name or external id)"
                    value={buSearchTerm}
                    onchange={handleBuSearchChange}
                ></lightning-input>
                <template if:true={buSearchResults.length}>
                    <ul class="bu-search-results">
                        <template for:each={buSearchResults} for:item="hit">
                            <li key={hit.accountId}>
                                <button
                                    type="button"
                                    class="bu-search-hit"
                                    data-id={hit.accountId}
                                    onclick={handleBuAccountPick}
                                >
                                    {hit.name}
                                    <span class="muted"> · {hit.externalId} · {hit.city}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:true={hasSelectedBuAccount}>
                    <p class="summary">Selected: {selectedBuAccountLabel}</p>
                    <lightning-input
                        type="checkbox"
                        label="Show inactive links"
                        checked={showInactiveBuLinks}
                        onchange={handleShowInactiveBuLinksChange}
                    ></lightning-input>
                    <div class="bu-form-grid">
                        <lightning-combobox
                            label="Business Unit"
                            value={selectedBuTerritoryId}
                            options={buOptionItems}
                            onchange={handleBuTerritoryChange}
                            placeholder="Select TERR_BU_*"
                        ></lightning-combobox>
                        <lightning-combobox
                            label="Potentiality"
                            value={linkPotentiality}
                            options={potentialityOptions}
                            onchange={handleLinkPotentialityChange}
                        ></lightning-combobox>
                        <lightning-combobox
                            label="Propensity"
                            value={linkPropensity}
                            options={propensityOptions}
                            onchange={handleLinkPropensityChange}
                        ></lightning-combobox>
                        <lightning-button
                            variant="brand"
                            label="Save link"
                            onclick={handleSaveBuLink}
                            disabled={isBuSaveDisabled}
                        ></lightning-button>
                    </div>
                    <template if:true={hasAccountBuLinks}>
                        <table class="dup-table bu-link-table">
                            <thead>
                                <tr>
                                    <th>Business Unit</th>
                                    <th>Potentiality</th>
                                    <th>Propensity</th>
                                    <th>Active</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={accountBuLinks} for:item="link">
                                    <tr key={link.id}>
                                        <td>{link.businessUnitName}</td>
                                        <td>{link.potentiality}</td>
                                        <td>{link.propensity}</td>
                                        <td>{link.isActive}</td>
                                        <td>
                                            <template if:true={link.isActive}>
                                                <lightning-button
                                                    variant="destructive-text"
                                                    label="Deactivate"
                                                    data-id={link.id}
                                                    onclick={handleDeactivateBuLink}
                                                    disabled={isBusy}
                                                ></lightning-button>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <div class="actions">
                        <lightning-button
                            label="Export all links"
                            onclick={handleExportBuLinks}
                            disabled={isBusy}
                        ></lightning-button>
                        <lightning-input
                            type="file"
                            label="Import links (.xlsx)"
                            accept=".xlsx,.xls"
                            onchange={handleBuImportFile}
                        ></lightning-input>
                        <span class="file-name">{buImportFileName}</span>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={isExportTab}>
            <div class="panel">
                <p class="help">Download Accounts and Affiliations as an Excel workbook.</p>
                <lightning-button
                    variant="brand"
                    label="Export Accounts &amp; Affiliations"
                    onclick={handleExport}
                    disabled={isBusy}
                ></lightning-button>
                <template if:true={isBusy}>
                    <div class="progress">
                        <div class="progress-bar" style={progressStyle}></div>
                    </div>
                    <p class="progress-msg">{progressMessage}</p>
                </template>
            </div>
        </template>

        <template if:true={isDuplicatesTab}>
            <div class="panel">
                <p class="help">Potential duplicates detected during the last import (name + location).</p>
                <template if:false={hasDuplicates}>
                    <p class="muted">No duplicate hits yet. Run a load/import with duplicate scanning enabled.</p>
                </template>
                <template if:true={hasDuplicates}>
                    <table class="dup-table">
                        <thead>
                            <tr>
                                <th>Incoming</th>
                                <th>Incoming Ext Id</th>
                                <th>Existing</th>
                                <th>Existing Ext Id</th>
                                <th>City</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={duplicateHits} for:item="hit">
                                <tr key={hit.existingId}>
                                    <td>{hit.incomingName}</td>
                                    <td>{hit.incomingExternalId}</td>
                                    <td>{hit.existingName}</td>
                                    <td>{hit.existingExternalId}</td>
                                    <td>{hit.existingCity}</td>
                                    <td>{hit.matchReason}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>
        </template>

        <template if:true={hasErrors}>
            <div class="errors">
                <h3>Errors / warnings</h3>
                <ul>
                    <template for:each={errorLines} for:item="err">
                        <li key={err}>{err}</li>
                    </template>
                </ul>
            </div>
        </template>
    </div>
</template>
