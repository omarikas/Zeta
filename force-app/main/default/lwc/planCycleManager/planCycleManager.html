<template>
    <section class="plan-cycle-manager">
        <header class="manager-header">
            <div class="manager-intro">
                <h3 class="manager-title">Plan Cycle Manager</h3>
                <p class="manager-subtitle">
                    Review monthly employee plans, edit account visit targets, and copy plans between months.
                </p>
            </div>
            <div class="manager-controls">
                <lightning-combobox
                    label="Year"
                    value={selectedYearValue}
                    options={yearOptions}
                    onchange={handleYearChange}
                ></lightning-combobox>
                <template if:true={showMonthView}>
                    <lightning-button label="Copy Plans" onclick={handleOpenCopyModal}></lightning-button>
                </template>
            </div>
        </header>

        <template if:true={showYearView}>
            <div class="month-grid">
                <template for:each={monthTiles} for:item="month">
                    <article
                        key={month.monthNumber}
                        class={month.tileClass}
                        data-month={month.monthNumber}
                        onclick={handleMonthTileClick}
                        role="button"
                        tabindex="0"
                        aria-label={month.monthLabel}
                    >
                        <div class="month-tile-top">
                            <span class="month-short">{month.monthShortLabel}</span>
                            <template if:true={month.isCurrentMonth}>
                                <span class="month-current-pill">Current</span>
                            </template>
                        </div>
                        <div class="month-count">{month.employeesWithPlans}</div>
                        <div class="month-meta">
                            <span>{month.coverageLabel} employees</span>
                            <span>{month.coveragePercent}% coverage</span>
                        </div>
                    </article>
                </template>
            </div>
            <template if:false={hasMonthTiles}>
                <div class="empty-state">
                    <p>No plan cycle data for this year.</p>
                </div>
            </template>
        </template>

        <template if:true={showMonthView}>
            <div class="breadcrumb-row">
                <lightning-button label="All months" onclick={handleBackToYear}></lightning-button>
                <span class="breadcrumb-label">{selectedMonthLabel}</span>
            </div>

            <template if:true={hasEmployeeRows}>
                <table class="manager-table">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Territory</th>
                            <th>Status</th>
                            <th>Account targets</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={employeeTableRows} for:item="row">
                            <tr key={row.employeeId}>
                                <td>{row.employeeName}</td>
                                <td>{row.territoryLabel}</td>
                                <td>
                                    <span class={row.statusClass}>{row.statusLabel}</span>
                                </td>
                                <td>{row.targetLabel}</td>
                                <td class="actions">
                                    <template if:true={row.hasPlan}>
                                        <lightning-button
                                            label="Edit"
                                            data-employee-id={row.employeeId}
                                            data-time-card-id={row.timeCardId}
                                            onclick={handleEditPlan}
                                        ></lightning-button>
                                    </template>
                                    <template if:false={row.hasPlan}>
                                        <lightning-button
                                            label="Create plan"
                                            data-employee-id={row.employeeId}
                                            onclick={handleCreatePlan}
                                        ></lightning-button>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={hasEmployeeRows}>
                <div class="empty-state">
                    <p>No territory-assigned employees found.</p>
                </div>
            </template>
        </template>

        <template if:true={showEditView}>
            <div class="breadcrumb-row">
                <lightning-button label={selectedMonthLabel} onclick={handleBackToMonth}></lightning-button>
                <span class="breadcrumb-label">{selectedEmployee}</span>
            </div>

            <template if:true={editableTargets.length}>
                <table class="manager-table">
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th>Potentiality</th>
                            <th>Target visits</th>
                            <th>Actual visits</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={editableTargets} for:item="row">
                            <tr key={row.id}>
                                <td>{row.accountName}</td>
                                <td>{row.potentiality}</td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        variant="label-hidden"
                                        label="Target visits"
                                        value={row.targetVisitFrequency}
                                        data-id={row.id}
                                        min="0"
                                        step="1"
                                        onchange={handleTargetFrequencyChange}
                                    ></lightning-input>
                                </td>
                                <td>{row.actualVisits}</td>
                                <td>{row.frequencyStatus}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="edit-actions">
                    <lightning-button
                        label="Save targets"
                        variant="brand"
                        disabled={isSaveDisabled}
                        onclick={handleSaveTargets}
                    ></lightning-button>
                </div>
            </template>

            <template if:false={editableTargets.length}>
                <div class="empty-state">
                    <p>No account targets on this plan yet.</p>
                </div>
            </template>
        </template>

        <template if:true={showCopyModal}>
            <section class="copy-modal" role="dialog" aria-modal="true" aria-label="Copy plans between months">
                <div class="copy-modal-backdrop" onclick={handleCloseCopyModal}></div>
                <div class="copy-modal-panel">
                    <h3 class="copy-modal-title">Copy plans between months</h3>
                    <p class="copy-modal-copy">
                        Copy account visit targets from one month to another for all employees who already have a
                        source plan.
                    </p>
                    <div class="copy-modal-fields">
                        <lightning-combobox
                            label="Source month"
                            value={copySourceMonth}
                            options={monthOptions}
                            onchange={handleCopySourceChange}
                        ></lightning-combobox>
                        <lightning-combobox
                            label="Target month"
                            value={copyTargetMonth}
                            options={monthOptions}
                            onchange={handleCopyTargetChange}
                        ></lightning-combobox>
                    </div>
                    <div class="copy-modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseCopyModal}></lightning-button>
                        <lightning-button
                            label="Copy plans"
                            variant="brand"
                            disabled={isCopyDisabled}
                            onclick={handleCopyPlans}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>
    </section>
</template>
