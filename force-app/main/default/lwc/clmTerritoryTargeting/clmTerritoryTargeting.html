<template>
    <section class="territory-targeting">
        <h3 class="section-title">Territory Distribution</h3>
        <p class="section-help">{alignmentHelpText}</p>

        <div class="territory-toolbar">
            <lightning-input
                type="search"
                variant="label-hidden"
                label="Search Territories"
                placeholder="Search territories..."
                value={searchTerm}
                onchange={handleSearch}
            ></lightning-input>
            <lightning-input
                type="toggle"
                label="Allow unaligned selection"
                checked={allowUnaligned}
                message-toggle-active="Active"
                message-toggle-inactive="Inactive"
                onchange={handleToggleAllowUnaligned}
            ></lightning-input>
        </div>

        <template if:true={hasLinkedProducts}>
            <div class="alignment-legend">
                <span class="alignment-badge alignment-badge--aligned">Aligned</span>
                <span class="alignment-badge alignment-badge--none">No linked product alignment</span>
            </div>
        </template>

        <template if:true={hasTerritories}>
            <ul class="tree-list" role="tree" aria-label="Territory hierarchy">
                <template for:each={territoryFlatRows} for:item="row">
                    <li key={row.key} class={row.rowClass} role="treeitem">
                        <div class="tree-row-content" style={row.depthStyle}>
                            <template if:true={row.hasChildren}>
                                <button
                                    class="toggle-btn"
                                    data-id={row.id}
                                    onclick={handleTerritoryExpand}
                                    title="Expand or collapse"
                                >
                                    <lightning-icon icon-name={row.chevronIcon} size="x-small"></lightning-icon>
                                </button>
                            </template>
                            <template if:false={row.hasChildren}>
                                <span class="toggle-spacer"></span>
                            </template>

                            <template if:true={row.showCheckbox}>
                                <lightning-input
                                    type="checkbox"
                                    label={row.name}
                                    checked={row.checked}
                                    data-id={row.id}
                                    onchange={handleTerritoryCheck}
                                    variant="label-hidden"
                                ></lightning-input>
                            </template>

                            <span class={row.nameClass}>{row.name}</span>

                            <template if:true={row.showAlignment}>
                                <span class={row.badgeClass} title={row.alignmentLabel}>{row.alignmentLabel}</span>
                            </template>
                        </div>
                    </li>
                </template>
            </ul>
        </template>

        <template if:false={hasTerritories}>
            <p class="empty-state">No territories found.</p>
        </template>
    </section>
</template>
