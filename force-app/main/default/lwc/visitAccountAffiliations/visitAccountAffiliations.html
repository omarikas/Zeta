<template>
    <template if:true={isLoading}>
        <div class="slds-is-relative slds-p-around_medium">
            <lightning-spinner alternative-text="Loading account affiliations" size="small"></lightning-spinner>
        </div>
    </template>

    <template if:true={errorMessage}>
        <div class="slds-text-color_error slds-p-around_small">{errorMessage}</div>
    </template>

    <template if:true={hasAccount}>
        <c-account-affiliation-network record-id={accountId}></c-account-affiliation-network>
    </template>

    <template if:true={showEmptyState}>
        <div class="slds-text-body_small slds-p-around_small slds-text-color_weak">
            No account is linked to this visit.
        </div>
    </template>
</template>
