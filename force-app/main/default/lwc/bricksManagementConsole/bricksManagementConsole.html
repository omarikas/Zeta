<template>
    <section class="bricks-console">
        <header class="console-header">
            <div class="console-header-text">
                <p class="console-subtitle">
                    Align IQVIA IMS / IbnSina / Pharmaoverseas geographic bricks to territories and manage pharmacy membership.
                </p>
            </div>
            <div class="console-header-actions">
                <lightning-button
                    label="Load Demo Bricks"
                    onclick={handleSeedDemoData}
                    disabled={isSeeding}
                ></lightning-button>
                <lightning-button
                    label="New Brick"
                    variant="brand"
                    onclick={handleNewBrick}
                ></lightning-button>
            </div>
        </header>

        <div class="console-panels">
            <section class="panel panel-territories">
                <div class="panel-heading">
                    <h3>Territories</h3>
                    <p class="panel-caption">Filter bricks by aligned territory</p>
                </div>
                <template if:true={hasTerritories}>
                    <ul class="tree-list" role="tree" aria-label="Territory tree">
                        <template for:each={territoryFlatRows} for:item="row">
                            <li key={row.key} class={row.rowClass} role="treeitem">
                                <div class="tree-row-content" style={row.depthStyle}>
                                    <template if:true={row.hasChildren}>
                                        <button
                                            class="toggle-btn"
                                            data-id={row.id}
                                            onclick={handleTerritoryToggle}
                                            title="Expand or collapse"
                                        >
                                            <lightning-icon icon-name={row.chevronIcon} size="x-small"></lightning-icon>
                                        </button>
                                    </template>
                                    <template if:false={row.hasChildren}>
                                        <span class="toggle-spacer"></span>
                                    </template>
                                    <button
                                        class="territory-select-btn"
                                        data-id={row.id}
                                        data-name={row.name}
                                        onclick={handleTerritorySelect}
                                    >
                                        {row.name}
                                    </button>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false={hasTerritories}>
                    <div class="empty-state">
                        <p>No territories found. Run territory seeding first.</p>
                    </div>
                </template>
            </section>

            <section class="panel panel-bricks">
                <div class="panel-heading">
                    <h3>Bricks — {selectedTerritoryName}</h3>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        label="Search bricks"
                        placeholder="Search by name, code, city..."
                        value={brickSearchTerm}
                        onchange={handleBrickSearch}
                    ></lightning-input>
                </div>

                <template if:true={hasBricks}>
                    <div class="brick-list">
                        <template for:each={filteredBrickRows} for:item="brick">
                            <article key={brick.brickId} class={brick.rowClass}>
                                <button
                                    class="brick-select-btn"
                                    data-brickid={brick.brickId}
                                    data-brickname={brick.brickName}
                                    onclick={handleBrickSelect}
                                >
                                    <span class="brick-name">{brick.brickName}</span>
                                    <span class="brick-meta">
                                        {brick.brickCode} · {brick.dataSource} · {brick.city}
                                    </span>
                                    <span class="brick-count">{brick.pharmacyCount} pharmacies</span>
                                </button>
                                <div class="brick-actions">
                                    <lightning-button-icon
                                        icon-name="utility:edit"
                                        alternative-text="Edit"
                                        title="Edit brick"
                                        data-id={brick.brickId}
                                        onclick={handleEditBrick}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        icon-name="utility:target"
                                        alternative-text="Align"
                                        title="Align to selected territory"
                                        data-id={brick.brickId}
                                        onclick={handleAssignTerritory}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Delete"
                                        title="Delete brick"
                                        data-id={brick.brickId}
                                        onclick={handleDeleteBrick}
                                    ></lightning-button-icon>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>
                <template if:false={hasBricks}>
                    <div class="empty-state">
                        <p>No bricks for this territory. Create one or load demo data.</p>
                    </div>
                </template>
            </section>

            <section class="panel panel-pharmacies">
                <div class="panel-heading">
                    <h3>{pharmacyPaneTitle}</h3>
                </div>

                <template if:true={showPharmacyPane}>
                    <div class="pharmacy-add-row">
                        <lightning-input
                            type="search"
                            label="Search pharmacies"
                            value={pharmacySearchTerm}
                            onchange={handlePharmacySearch}
                        ></lightning-input>
                        <lightning-combobox
                            label="Pharmacy account"
                            value={selectedPharmacyId}
                            options={pharmacyOptions}
                            placeholder="Select pharmacy"
                            onchange={handlePharmacySelect}
                        ></lightning-combobox>
                        <lightning-button
                            label="Add to Brick"
                            variant="brand"
                            disabled={isAddPharmacyDisabled}
                            onclick={handleAddPharmacy}
                        ></lightning-button>
                    </div>
                    <lightning-datatable
                        key-field="membershipId"
                        data={pharmacyRows}
                        columns={pharmacyColumns}
                        hide-checkbox-column
                        onrowaction={handlePharmacyRowAction}
                    ></lightning-datatable>
                </template>
                <template if:false={showPharmacyPane}>
                    <div class="empty-state">
                        <p>Select a brick to view and manage linked pharmacy accounts.</p>
                    </div>
                </template>
            </section>
        </div>

        <template if:true={showBrickModal}>
            <section class="brick-modal" role="dialog" aria-modal="true" aria-label={modalTitle}>
                <div class="brick-modal-backdrop" onclick={handleCloseBrickModal}></div>
                <div class="brick-modal-panel">
                    <h3 class="brick-modal-title">{modalTitle}</h3>
                    <div class="brick-form-grid">
                        <lightning-input
                            label="Brick Name"
                            data-field="name"
                            value={draftBrick.name}
                            required
                            onchange={handleDraftChange}
                        ></lightning-input>
                        <lightning-input
                            label="External ID"
                            data-field="externalId"
                            value={draftBrick.externalId}
                            onchange={handleDraftChange}
                        ></lightning-input>
                        <lightning-input
                            label="Brick Code (IQVIA)"
                            data-field="brickCode"
                            value={draftBrick.brickCode}
                            onchange={handleDraftChange}
                        ></lightning-input>
                        <lightning-combobox
                            label="Data Source"
                            data-field="dataSource"
                            value={draftBrick.dataSource}
                            options={dataSourceOptions}
                            onchange={handleDraftChange}
                        ></lightning-combobox>
                        <lightning-input
                            label="Governorate"
                            data-field="governorate"
                            value={draftBrick.governorate}
                            onchange={handleDraftChange}
                        ></lightning-input>
                        <lightning-input
                            label="City / District"
                            data-field="city"
                            value={draftBrick.city}
                            onchange={handleDraftChange}
                        ></lightning-input>
                        <lightning-input
                            type="checkbox"
                            label="Active"
                            data-field="isActive"
                            checked={draftBrick.isActive}
                            onchange={handleDraftChange}
                        ></lightning-input>
                    </div>
                    <div class="brick-modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseBrickModal}></lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            disabled={isSaveBrickDisabled}
                            onclick={handleSaveBrick}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>
    </section>
</template>
