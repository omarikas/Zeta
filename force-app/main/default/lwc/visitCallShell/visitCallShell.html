<template>
    <div class="visit-call-shell">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading visit" size="medium"></lightning-spinner>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
        </template>

        <template if:true={visit}>
            <section class="visit-hero">
                <div class="visit-hero-top">
                    <span class={accountBadgeClass}>{accountBadgeLabel}</span>
                    <span class={statusBadgeClass}>{visit.status}</span>
                    <template if:true={isDoubleVisit}>
                        <span class="double-visit-badge">Double Visit</span>
                    </template>
                </div>
                <h1 class="visit-account-name">{visit.accountName}</h1>
                <template if:true={accountMetaLine}>
                    <p class="visit-account-meta">{accountMetaLine}</p>
                </template>
                <div class="visit-hero-actions">
                    <lightning-button label="View Account" icon-name="utility:account" onclick={handleOpenAccount}></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small coaching-btn"
                        label={coachingButtonLabel}
                        icon-name="utility:education"
                        onclick={handleCoachingAction}
                    ></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small medical-inquiry-btn"
                        label={medicalInquiryButtonLabel}
                        icon-name="utility:question"
                        onclick={handleMedicalInquiryAction}
                    ></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small whatsapp-btn"
                        label="Send products survey on WhatsApp"
                        icon-name="utility:chat"
                        onclick={handleOpenWhatsAppModal}
                    ></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small whatsapp-btn"
                        label="Message meeting reminder"
                        icon-name="utility:chat"
                        onclick={handleOpenReminderModal}
                    ></lightning-button>
                </div>
            </section>

            <div class="shell-layout">
                <nav class="shell-nav" aria-label="Call report sections">
                    <template for:each={navSections} for:item="section">
                        <button
                            key={section.id}
                            class={section.className}
                            data-section={section.id}
                            onclick={handleNavClick}
                        >
                            {section.label}
                        </button>
                    </template>
                </nav>

                <main class="shell-content">
                    <template if:true={isDetailsSection}>
                        <article class="visit-panel">
                            <h2 class="visit-panel-title">Visit Details</h2>
                            <dl class="visit-detail-list">
                                <div class="visit-detail-row">
                                    <dt>Visit</dt>
                                    <dd>{visit.name}</dd>
                                </div>
                                <div class="visit-detail-row">
                                    <dt>Start</dt>
                                    <dd>{startLabel}</dd>
                                </div>
                                <div class="visit-detail-row">
                                    <dt>End</dt>
                                    <dd>{endLabel}</dd>
                                </div>
                                <div class="visit-detail-row">
                                    <dt>Duration</dt>
                                    <dd>{visit.durationLabel}</dd>
                                </div>
                                <div class="visit-detail-row">
                                    <dt>Visit Type</dt>
                                    <dd>{visit.visitType}</dd>
                                </div>
                                <div class="visit-detail-row">
                                    <dt>Assigned To</dt>
                                    <dd>{visit.assignedToName}</dd>
                                </div>
                            </dl>
                            <lightning-combobox
                                class="slds-m-top_small"
                                label="Status"
                                value={statusValue}
                                options={statusOptions}
                                onchange={handleStatusChange}
                                disabled={isLocked}
                                required
                            ></lightning-combobox>
                            <template if:true={showCancellationReason}>
                                <lightning-textarea
                                    class="slds-m-top_small"
                                    label="Cancellation Reason"
                                    value={cancellationReason}
                                    onchange={handleCancellationChange}
                                    disabled={isLocked}
                                    required
                                ></lightning-textarea>
                            </template>
                            <lightning-textarea
                                class="slds-m-top_small"
                                label="Visit Objective"
                                value={visitObjective}
                                onchange={handleObjectiveChange}
                                disabled={isLocked}
                                placeholder="What do you want to achieve on this call?"
                            ></lightning-textarea>
                            <lightning-textarea
                                class="slds-m-top_small"
                                label="Visit Notes"
                                value={visitNotes}
                                onchange={handleNotesChange}
                                disabled={isLocked}
                                placeholder="Key discussion points and outcomes."
                            ></lightning-textarea>
                            <lightning-input
                                class="slds-m-top_small"
                                type="date"
                                label="Next Visit Date"
                                value={nextVisitDate}
                                onchange={handleNextVisitChange}
                                disabled={isLocked}
                            ></lightning-input>
                        </article>
                    </template>

                    <template if:true={isAffiliationsSection}>
                        <article class="visit-panel visit-panel-affiliations">
                            <c-visit-account-affiliations record-id={recordId}></c-visit-account-affiliations>
                        </article>
                    </template>

                    <template if:true={isAttendeesSection}>
                        <c-visit-attendee-picker
                            visit-id={recordId}
                            attendees={attendees}
                            disabled={isLocked}
                            onattendeeschange={handleAttendeesChange}
                        ></c-visit-attendee-picker>
                    </template>

                    <template if:true={isProductsSection}>
                        <c-visit-product-detail-panel
                            visit-id={recordId}
                            products={products}
                            disabled={isLocked}
                            onproductschange={handleProductsChange}
                        ></c-visit-product-detail-panel>
                    </template>

                    <template if:true={isSamplesSection}>
                        <c-visit-sample-grid
                            visit-id={recordId}
                            samples={samples}
                            attendees={attendees}
                            scoped-brand-ids={selectedBrandIds}
                            disabled={isLocked}
                            onsampleschange={handleSamplesChange}
                        ></c-visit-sample-grid>
                    </template>

                    <template if:true={isPresentationsSection}>
                        <c-clm-visit-presentations
                            record-id={recordId}
                            is-locked={isLocked}
                        ></c-clm-visit-presentations>
                    </template>
                </main>

                <aside class="shell-sidebar" aria-label="Neighbouring pharmacies and call history">
                    <c-visit-neighbouring-pharmacies visit-id={recordId}></c-visit-neighbouring-pharmacies>
                    <h2 class="sidebar-title sidebar-title-history">Call History</h2>
                    <c-visit-context-insights visit-id={recordId}></c-visit-context-insights>
                </aside>
            </div>

            <footer class="visit-footer">
                <template if:false={isLocked}>
                    <lightning-button
                        label="Save Visit"
                        variant="brand"
                        onclick={handleSave}
                        disabled={isSaving}
                    ></lightning-button>
                </template>
                <template if:true={isLocked}>
                    <p class="visit-locked-note">This visit is {visit.status} and cannot be edited.</p>
                </template>
            </footer>
        </template>

        <template if:true={showCoachingModal}>
            <!-- visit coaching modal removed for migration -->
        </template>

        <template if:true={showMedicalInquiryModal}>
            <c-visit-medical-inquiry-modal
                visit-id={recordId}
                onclose={handleCloseMedicalInquiryModal}
                oninquirycreated={handleMedicalInquiryCreated}
            ></c-visit-medical-inquiry-modal>
        </template>

        <template if:true={showWhatsAppModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open whatsapp-modal">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Send Product Survey on WhatsApp</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={whatsappLoading}>
                            <lightning-spinner alternative-text="Loading survey options" size="small"></lightning-spinner>
                        </template>
                        <template if:false={whatsappLoading}>
                            <template if:true={whatsappError}>
                                <p class="whatsapp-error">{whatsappError}</p>
                            </template>
                            <template if:false={whatsappError}>
                                <lightning-combobox
                                    label="Recipient phone"
                                    value={selectedPhoneKey}
                                    options={phoneOptions}
                                    onchange={handlePhoneChange}
                                    required
                                ></lightning-combobox>
                                <lightning-combobox
                                    class="slds-m-top_small"
                                    label="Product"
                                    value={selectedProductName}
                                    options={productOptions}
                                    onchange={handleProductChange}
                                    required
                                ></lightning-combobox>
                                <div class="message-preview slds-m-top_medium">
                                    <p class="preview-label">Message preview</p>
                                    <p class="preview-body">{whatsappMessagePreview}</p>
                                </div>
                            </template>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseWhatsAppModal}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Open WhatsApp"
                            variant="brand"
                            onclick={handleSendWhatsApp}
                            disabled={whatsappSendDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showReminderModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open whatsapp-modal">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Message Meeting Reminder</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={reminderLoading}>
                            <lightning-spinner alternative-text="Loading reminder options" size="small"></lightning-spinner>
                        </template>
                        <template if:false={reminderLoading}>
                            <template if:true={reminderError}>
                                <p class="whatsapp-error">{reminderError}</p>
                            </template>
                            <template if:false={reminderError}>
                                <lightning-combobox
                                    label="Recipient phone"
                                    value={selectedReminderPhoneKey}
                                    options={reminderPhoneOptions}
                                    onchange={handleReminderPhoneChange}
                                    required
                                ></lightning-combobox>
                                <div class="message-preview slds-m-top_medium">
                                    <p class="preview-label">Message preview</p>
                                    <p class="preview-body">{reminderMessagePreview}</p>
                                </div>
                            </template>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseReminderModal}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Open WhatsApp"
                            variant="brand"
                            onclick={handleSendReminderWhatsApp}
                            disabled={reminderSendDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
