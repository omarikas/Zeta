<template>
    <lightning-card title="Request Time Off" icon-name="standard:date_input">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-body_regular slds-m-bottom_medium">
                Submit holiday, sick leave, training, or other time away. Your manager will be notified when you submit for approval.
            </p>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Type"
                        value={typeValue}
                        options={typeOptions}
                        onchange={handleTypeChange}
                        required
                        placeholder="Select type"
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Span Type"
                        value={spanTypeValue}
                        options={spanTypeOptions}
                        onchange={handleSpanTypeChange}
                        required
                        placeholder="Full day or partial hours"
                        field-level-help="Full Day covers one calendar day. For multiple days, submit separate requests."
                    ></lightning-combobox>
                </div>

                <template if:true={isHoursSpan}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-combobox
                            label="Duration (Hours)"
                            value={durationValue}
                            options={durationOptions}
                            onchange={handleDurationChange}
                            required
                            placeholder="1–8 hours"
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="datetime"
                            label="Start Date & Time"
                            value={startDateTimeValue}
                            onchange={handleStartDateTimeChange}
                            required
                        ></lightning-input>
                    </div>
                </template>

                <template if:true={isFullDaySpan}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="date"
                            label="Date"
                            value={startDateValue}
                            onchange={handleStartDateChange}
                            required
                        ></lightning-input>
                    </div>
                </template>

                <div class="slds-col slds-size_1-of-1">
                    <lightning-textarea
                        label="Comments"
                        value={commentsValue}
                        onchange={handleCommentsChange}
                        placeholder="Optional notes for your manager"
                        max-length="32000"
                    ></lightning-textarea>
                </div>
            </div>

            <div class="slds-m-top_medium slds-grid slds-grid_align-end slds-gutters_x-small">
                <lightning-button
                    label="Save Draft"
                    onclick={handleSaveDraft}
                    disabled={isSaving}
                ></lightning-button>
                <lightning-button
                    variant="brand"
                    label="Submit for Approval"
                    onclick={handleSubmit}
                    disabled={isSaving}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>

    <lightning-card title="My Recent Requests" icon-name="standard:timesheet" class="slds-m-top_medium">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={requestsError}>
                <div class="slds-text-color_error slds-m-bottom_small">{requestsError}</div>
            </template>
            <template if:true={hasRequests}>
                <lightning-datatable
                    key-field="id"
                    data={myRequests}
                    columns={columns}
                    hide-checkbox-column
                ></lightning-datatable>
            </template>
            <template if:false={hasRequests}>
                <p class="slds-text-body_regular slds-text-color_weak">No time off requests yet.</p>
            </template>
        </div>
    </lightning-card>
</template>
