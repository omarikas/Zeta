<template>
    <article class="mendix-hub">
        <header class="mendix-hub-header">
            <img src={mendixLogoUrl} alt="Mendix logo" class="mendix-logo" />
            <div>
                <h2 class="mendix-hub-title">Mendix Integration Hub</h2>
                <p class="mendix-hub-subtitle">Sync and monitor data flows between Salesforce and Mendix applications.</p>
            </div>
        </header>
        <div class="mendix-hub-body">
            <div class="slds-box slds-theme_info slds-m-bottom_medium">
                <p>{statusMessage}</p>
                <p class="slds-text-body_small slds-m-top_x-small">Configure Named Credential <strong>Mendix_API</strong> when Mendix endpoints are available.</p>
            </div>
            <h3 class="slds-text-heading_small">Recent Sync Logs</h3>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead><tr><th>Log</th><th>Object</th><th>External Id</th><th>Status</th><th>Last Sync</th></tr></thead>
                <tbody>
                    <template for:each={logs} for:item="log">
                        <tr key={log.Id}>
                            <td>{log.Name}</td><td>{log.Object_Type__c}</td><td>{log.External_Id__c}</td>
                            <td>{log.Sync_Status__c}</td><td>{log.Last_Sync__c}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </article>
</template>
