<template>
    <section class="panel-section">
        <h3 class="panel-title">Presentations</h3>
        <lightning-combobox
            label="CLM Presentation"
            value={clmPresentation}
            options={presentationOptions}
            onchange={handlePresentationChange}
            disabled={disabled}
            placeholder="Select presentation used on call"
        ></lightning-combobox>

        <template if:true={displaySessions.length}>
            <h4 class="sub-title slds-m-top_medium">Session History</h4>
            <template for:each={displaySessions} for:item="session">
                <article key={session.key} class="session-card">
                    <p class="session-name">{session.presentationName}</p>
                    <p class="session-meta">
                        {session.status} · {session.slidesPresentedCount} slides · {session.durationLabel}
                    </p>
                </article>
            </template>
        </template>
        <template if:false={displaySessions.length}>
            <p class="empty-hint slds-m-top_small">CLM session metrics appear here after presentations are delivered.</p>
        </template>
    </section>
</template>
