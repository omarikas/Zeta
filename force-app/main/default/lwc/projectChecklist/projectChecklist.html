<template>
    <section class="proj-panel proj-check">
        <template if:true={hasChecklist}>
            <header class="proj-panel-header">
                <div class="proj-check-ring" style={checklist.ringStyle} aria-hidden="true">
                    <div class="proj-check-ring-inner">
                        <span class="proj-check-ring-value">{checklist.progressPercent}%</span>
                    </div>
                </div>
                <div>
                    <h2 class="proj-panel-title">Checklist</h2>
                    <p class="proj-panel-subtitle">{checklist.progressLabel}</p>
                </div>
            </header>
        </template>

        <template if:false={hasChecklist}>
            <header class="proj-panel-header">
                <div class="proj-panel-header-icon" aria-hidden="true">
                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                </div>
                <div>
                    <h2 class="proj-panel-title">Checklist</h2>
                    <p class="proj-panel-subtitle">Delivery progress</p>
                </div>
            </header>
        </template>

        <template if:true={isLoading}>
            <div class="proj-panel-loading">
                <lightning-spinner alternative-text="Loading checklist" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="proj-panel-alert">{error}</div>
        </template>

        <template if:true={hasChecklist}>
            <template if:true={hasItems}>
                <ul class="proj-check-list">
                    <template for:each={checklist.items} for:item="item">
                        <li key={item.id} class={item.itemClass}>
                            <span class="proj-check-icon-wrap" aria-hidden="true">
                                <lightning-icon icon-name={item.iconName} size="xx-small"></lightning-icon>
                            </span>
                            <div class="proj-check-copy">
                                <span class="proj-check-label">{item.label}</span>
                                <span class="proj-check-meta">{item.source} · {item.status}</span>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template if:false={hasItems}>
                <p class="proj-panel-empty">No checklist items yet.</p>
            </template>
        </template>
    </section>
</template>
