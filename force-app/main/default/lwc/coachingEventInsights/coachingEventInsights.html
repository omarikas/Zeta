<template>
    <div class="insights-panel">
        <template lwc:if={status}>
            <div class="status-row">
                <span class={statusBadgeClass}>{status}</span>
            </div>
        </template>

        <article class="insight-card scores-card">
            <header class="card-header">
                <lightning-icon icon-name="utility:metrics" size="x-small" class="card-icon"></lightning-icon>
                <h2 class="card-title">Scores</h2>
            </header>
            <template lwc:if={hasScores}>
                <div class="score-grid">
                    <div class="score-tile manager-tile">
                        <span class="score-tile-label">Manager</span>
                        <span class="score-tile-value">{managerScoreDisplay}</span>
                    </div>
                    <div class="score-tile employee-tile">
                        <span class="score-tile-label">Rep</span>
                        <span class="score-tile-value">{employeeScoreDisplay}</span>
                    </div>
                    <div class="score-tile previous-tile">
                        <span class="score-tile-label">Previous</span>
                        <span class="score-tile-value">{previousScoreDisplay}</span>
                        <template lwc:if={scoreDeltaDisplay}>
                            <span class={scoreDeltaClass}>{scoreDeltaDisplay}</span>
                        </template>
                    </div>
                </div>
            </template>
            <template lwc:else>
                <p class="empty-hint">Scores appear after the evaluation is saved.</p>
            </template>
        </article>

        <article class="insight-card strengths-card">
            <header class="card-header">
                <lightning-icon icon-name="utility:success" size="x-small" class="card-icon strength-icon"></lightning-icon>
                <h2 class="card-title">Main Areas of Strength</h2>
            </header>
            <template lwc:if={hasStrengths}>
                <ul class="insight-list">
                    <template for:each={strengths} for:item="item">
                        <li key={item.id} class="insight-item strength-item">
                            <span class="item-label">{item.label}</span>
                            <span class="item-section">{item.section}</span>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <p class="empty-hint">Strengths are derived from manager scores of 5–6.</p>
            </template>
        </article>

        <article class="insight-card weaknesses-card">
            <header class="card-header">
                <lightning-icon icon-name="utility:warning" size="x-small" class="card-icon weakness-icon"></lightning-icon>
                <h2 class="card-title">Areas of Weakness</h2>
            </header>
            <template lwc:if={hasWeaknesses}>
                <ul class="insight-list">
                    <template for:each={weaknesses} for:item="item">
                        <li key={item.id} class="insight-item weakness-item">
                            <span class="item-label">{item.label}</span>
                            <span class="item-section">{item.section}</span>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <p class="empty-hint">Weaknesses are derived from manager scores of 1–2.</p>
            </template>
        </article>

        <article class="insight-card action-card">
            <header class="card-header">
                <lightning-icon icon-name="utility:task" size="x-small" class="card-icon action-icon"></lightning-icon>
                <h2 class="card-title">Recommended Action Plan</h2>
            </header>
            <template lwc:if={hasActionPlan}>
                <ol class="action-list">
                    <template for:each={actionPlanItems} for:item="item">
                        <li key={item.id} class="action-item">{item.text}</li>
                    </template>
                </ol>
            </template>
            <template lwc:else>
                <p class="empty-hint">Action plan is generated when evaluation scores are saved.</p>
            </template>
        </article>
    </div>
</template>
