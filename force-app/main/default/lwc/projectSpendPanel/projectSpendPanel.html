<template>
    <section class="proj-panel proj-spend">
        <header class="proj-panel-header">
            <div class="proj-panel-header-icon proj-spend-icon" aria-hidden="true">
                <lightning-icon icon-name="utility:moneybag" size="x-small"></lightning-icon>
            </div>
            <div>
                <h2 class="proj-panel-title">Spendings</h2>
                <p class="proj-panel-subtitle">Budget utilization and activity investment</p>
            </div>
        </header>

        <template if:true={isLoading}>
            <div class="proj-panel-loading">
                <lightning-spinner alternative-text="Loading spend data" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="proj-panel-alert">{error}</div>
        </template>

        <template if:true={hasSummary}>
            <div class="proj-spend-body">
                <div class="proj-spend-gauge-wrap">
                    <div class={summary.gaugeClass} style={summary.gaugeStyle}>
                        <div class="proj-spend-gauge-inner">
                            <span class="proj-spend-gauge-value">
                                <template if:true={summary.hasBudget}>{summary.budgetPercent}%</template>
                                <template if:false={summary.hasBudget}>—</template>
                            </span>
                            <span class="proj-spend-gauge-label">utilized</span>
                        </div>
                    </div>
                </div>

                <div class="proj-spend-metrics">
                    <template if:true={summary.hasBudget}>
                        <div class="proj-spend-metric">
                            <span class="proj-spend-metric-label">Spent</span>
                            <span class="proj-spend-metric-value">{summary.spentDisplay}</span>
                        </div>
                        <div class="proj-spend-metric">
                            <span class="proj-spend-metric-label">Budget</span>
                            <span class="proj-spend-metric-value">{summary.totalDisplay}</span>
                        </div>
                        <div class="proj-spend-metric">
                            <span class="proj-spend-metric-label">Remaining</span>
                            <span class="proj-spend-metric-value">{summary.remainingDisplay}</span>
                        </div>
                    </template>
                    <template if:true={showPlaceholder}>
                        <p class="proj-spend-placeholder">
                            Budget tracking coming soon. Set a total budget on the project to unlock spend analytics.
                        </p>
                    </template>
                </div>

                <div class="proj-spend-bar-block">
                    <div class="proj-spend-bar-label">
                        <span>Budget utilization</span>
                        <span>{utilizationLabel}</span>
                    </div>
                    <div class="proj-spend-bar-track">
                        <div class="proj-spend-bar-fill" style={summary.budgetBarStyle}></div>
                    </div>
                </div>

                <div class="proj-spend-activity-grid">
                    <div class="proj-spend-activity">
                        <span class="proj-spend-activity-label">Meetings</span>
                        <span class="proj-spend-activity-value">{summary.meetingsDisplay}</span>
                        <div class="proj-spend-activity-track">
                            <div class="proj-spend-activity-fill proj-spend-activity-fill--blue" style={summary.meetingsBarStyle}></div>
                        </div>
                    </div>
                    <div class="proj-spend-activity">
                        <span class="proj-spend-activity-label">Round tables</span>
                        <span class="proj-spend-activity-value">{summary.roundTablesDisplay}</span>
                        <div class="proj-spend-activity-track">
                            <div class="proj-spend-activity-fill proj-spend-activity-fill--purple" style={summary.roundTablesBarStyle}></div>
                        </div>
                    </div>
                    <div class="proj-spend-activity">
                        <span class="proj-spend-activity-label">Visits</span>
                        <span class="proj-spend-activity-value">{summary.visitsDisplay}</span>
                        <div class="proj-spend-activity-track">
                            <div class="proj-spend-activity-fill proj-spend-activity-fill--teal" style={summary.visitsBarStyle}></div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </section>
</template>
