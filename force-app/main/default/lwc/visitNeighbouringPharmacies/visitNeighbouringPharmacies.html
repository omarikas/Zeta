<template>
    <section class="pharmacy-panel">
        <header class="panel-header">
            <lightning-icon icon-name="utility:location" size="x-small" class="panel-icon"></lightning-icon>
            <h2 class="panel-title">Neighbouring Pharmacies</h2>
        </header>

        <template if:true={isLoading}>
            <div class="panel-loading">
                <lightning-spinner alternative-text="Loading account pharmacies" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <p class="panel-empty panel-error">{error}</p>
        </template>

        <template if:false={isLoading}>
            <template if:false={error}>
                <template if:true={showGeoEmpty}>
                    <div class="map-placeholder">
                        <lightning-icon icon-name="utility:world" size="small"></lightning-icon>
                        <p>No geo coordinates on this account — add billing latitude/longitude to show the map.</p>
                    </div>
                </template>

                <template if:false={showGeoEmpty}>
                    <div class="map-container" lwc:dom="manual"></div>
                    <div class="map-legend">
                        <span class="legend-item legend-in-list">
                            <span class="legend-dot legend-dot-in-list"></span>
                            In list
                        </span>
                        <span class="legend-item legend-out-list">
                            <span class="legend-dot legend-dot-out-list"></span>
                            Out of list
                        </span>
                    </div>

                    <div class="list-filter" role="tablist" aria-label="Pharmacy list filter">
                        <button
                            class={allFilterClass}
                            data-filter="all"
                            role="tab"
                            aria-selected={isAllFilter}
                            onclick={handleFilterClick}
                        >
                            All
                        </button>
                        <button
                            class={inListFilterClass}
                            data-filter="inList"
                            role="tab"
                            aria-selected={isInListFilter}
                            onclick={handleFilterClick}
                        >
                            In list
                        </button>
                        <button
                            class={outListFilterClass}
                            data-filter="outOfList"
                            role="tab"
                            aria-selected={isOutListFilter}
                            onclick={handleFilterClick}
                        >
                            Out of list
                        </button>
                    </div>

                    <template if:true={hasPharmacies}>
                        <p class="radius-hint">
                            {filteredCount} pharmacies within {searchRadiusKm} km · showing {pageRangeLabel}
                        </p>
                        <ol class="pharmacy-list" start={pageStartIndex}>
                            <template for:each={visiblePharmacies} for:item="pharmacy">
                                <li key={pharmacy.key} class="pharmacy-row">
                                    <span class="rank-badge">{pharmacy.rank}</span>
                                    <div class="pharmacy-main">
                                        <div class="pharmacy-title-row">
                                            <template if:true={pharmacy.isAccountRecord}>
                                                <button
                                                    class="pharmacy-name-btn"
                                                    data-id={pharmacy.accountId}
                                                    onclick={handleOpenPharmacy}
                                                    disabled={pharmacy.isAdding}
                                                    title="Schedule pharmacy visit after this visit"
                                                >
                                                    {pharmacy.name}
                                                </button>
                                            </template>
                                            <template if:false={pharmacy.isAccountRecord}>
                                                <button
                                                    class="pharmacy-name-btn pharmacy-name-external"
                                                    data-key={pharmacy.key}
                                                    data-external-id={pharmacy.externalId}
                                                    data-name={pharmacy.name}
                                                    data-street={pharmacy.street}
                                                    data-city={pharmacy.city}
                                                    data-state={pharmacy.state}
                                                    data-postal-code={pharmacy.postalCode}
                                                    data-country={pharmacy.country}
                                                    data-phone={pharmacy.phone}
                                                    data-latitude={pharmacy.latitude}
                                                    data-longitude={pharmacy.longitude}
                                                    onclick={handleAddExternalPharmacy}
                                                    disabled={pharmacy.isAdding}
                                                    title="Add as pharmacy and schedule after this visit"
                                                >
                                                    {pharmacy.name}
                                                </button>
                                            </template>
                                            <span class={pharmacy.badgeClass}>{pharmacy.badgeLabel}</span>
                                        </div>
                                        <span class="pharmacy-meta">{pharmacy.addressLabel} · {pharmacy.distanceLabel}</span>
                                    </div>
                                </li>
                            </template>
                        </ol>

                        <template if:true={showPager}>
                            <div class="pager">
                                <lightning-button
                                    label="Previous"
                                    onclick={handlePreviousPage}
                                    disabled={isFirstPage}
                                ></lightning-button>
                                <span class="page-label">Page {currentPage} of {totalPages}</span>
                                <lightning-button
                                    label="Next"
                                    onclick={handleNextPage}
                                    disabled={isLastPage}
                                ></lightning-button>
                            </div>
                        </template>
                    </template>

                    <template if:false={hasPharmacies}>
                        <template if:false={externalLoading}>
                            <p class="panel-empty">{emptyListMessage}</p>
                        </template>
                    </template>

                    <template if:true={externalLoading}>
                        <div class="lazy-load-row">
                            <lightning-spinner alternative-text="Loading additional pharmacies" size="x-small"></lightning-spinner>
                            <span>Loading additional pharmacies not in your list…</span>
                        </div>
                    </template>

                    <template if:true={externalLoadError}>
                        <p class="panel-empty external-error">{externalLoadError}</p>
                    </template>
                </template>
            </template>
        </template>
    </section>
</template>
