<template>
    <lightning-card title="Field Rep Planner" icon-name="standard:event">
        <div class="planner-shell">
            <div class="planner-toolbar">
                <template if:true={canSwitchPlannerView}>
                    <lightning-combobox
                        class="planner-viewer-combobox"
                        label="View planner for"
                        variant="label-hidden"
                        placeholder="My planner"
                        value={selectedContextUserId}
                        options={plannerViewerOptions}
                        onchange={handleContextUserChange}
                    ></lightning-combobox>
                    <template if:true={showViewerBadge}>
                        <span class="planner-territory-badge">{viewerBadgeLabel}</span>
                    </template>
                </template>
                <lightning-button-group>
                    <lightning-button label="Today" onclick={handleToday}></lightning-button>
                    <lightning-button label="This week" onclick={handleThisWeek}></lightning-button>
                    <lightning-button label="Next week" onclick={handleJumpNextWeek}></lightning-button>
                    <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous week" onclick={handlePrevWeek}></lightning-button-icon>
                    <lightning-button-icon icon-name="utility:chevronright" alternative-text="Next week" onclick={handleNextWeek}></lightning-button-icon>
                </lightning-button-group>

                <div class="slds-text-heading_small slds-m-left_small">{weekLabel}</div>

                <div class="slds-col_bump-left toolbar-view-actions">
                    <lightning-button
                        label={submitWeekLabel}
                        variant="brand"
                        onclick={handleSubmitWeek}
                        disabled={isSubmitWeekDisabled}
                    ></lightning-button>
                    <button
                        type="button"
                        class={planningPlusButtonClass}
                        title="Add TOT or meeting"
                        aria-expanded={showPlanningPalettePanel}
                        aria-label="Add TOT or meeting"
                        onclick={handleTogglePlanningPalette}
                        disabled={isReadOnlyPlannerView}
                    >
                        <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                    </button>
                    <div class="view-mode-switch" role="group" aria-label="Planner view">
                        <button
                            type="button"
                            class={calendarSwitchClass}
                            title="Calendar"
                            aria-pressed={isCalendarView}
                            aria-label="Calendar view"
                            onclick={handleShowCalendar}
                        >
                            <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
                            <span class="view-mode-switch__label">Calendar</span>
                        </button>
                        <button
                            type="button"
                            class={mapSwitchClass}
                            title="Map &amp; Route"
                            aria-pressed={isMapView}
                            aria-label="Map and route view"
                            onclick={handleShowMap}
                        >
                            <lightning-icon icon-name="utility:checkin" size="x-small"></lightning-icon>
                            <span class="view-mode-switch__label">Map</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class={mapToolbarClass} aria-hidden={isMapToolbarHidden}>
                <lightning-combobox
                    class="map-toolbar-day"
                    label="Map day"
                    variant="label-hidden"
                    value={mapDayKey}
                    options={mapDayOptions}
                    onchange={handleMapDayChange}
                    disabled={isMapToolbarDisabled}
                ></lightning-combobox>
                <lightning-button
                    label={buildRouteLabel}
                    variant="brand"
                    onclick={handleBuildRoute}
                    disabled={isRouteDisabled}
                ></lightning-button>
                <lightning-button
                    label={optimizeRouteLabel}
                    onclick={handleOptimizeRoute}
                    disabled={isOptimizeDisabled}
                ></lightning-button>
                <lightning-button
                    label="Update route &amp; calendar"
                    variant="success"
                    onclick={handleUpdateRouteAndCalendar}
                    disabled={isUpdateRouteDisabled}
                ></lightning-button>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading planner" size="medium"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
            </template>

            <template if:true={viewerContextLabel}>
                <div class="planner-readonly-banner">{viewerContextLabel}</div>
            </template>

            <div class="mobile-planner-nav" role="tablist" aria-label="Mobile view sections">
                <button
                    type="button"
                    class={mobileCalendarBtnClass}
                    role="tab"
                    aria-selected={isMobileCalendarTab}
                    onclick={handleSelectMobileCalendar}
                >
                    📅 Calendar Grid
                </button>
                <button
                    type="button"
                    class={mobileAccountsBtnClass}
                    role="tab"
                    aria-selected={isMobileAccountsTab}
                    onclick={handleSelectMobileAccounts}
                >
                    📋 Accounts ({totalAccountCount})
                </button>
            </div>

            <div class="planner-body" data-mobile-sub-view={mobileSubView}>
                <aside class="planner-sidebar">
                    <div class="sidebar-section-title">Accounts — drag to calendar</div>
                    <div class="slds-p-horizontal_small slds-p-bottom_x-small account-filters">
                        <div class="account-filters-toolbar">
                            <lightning-input
                                class="account-search-input"
                                type="search"
                                label="Search accounts"
                                variant="label-hidden"
                                placeholder={accountSearchPlaceholder}
                                value={accountSearch}
                                onchange={handleAccountSearch}
                                disabled={accountSearchDisabled}
                            ></lightning-input>
                            <button
                                type="button"
                                class={filterFunnelButtonClass}
                                title="Filter accounts"
                                aria-expanded={showAccountFilterPanel}
                                aria-label="Filter accounts"
                                onclick={handleToggleAccountFilters}
                                disabled={accountFiltersDisabled}
                            >
                                <lightning-icon icon-name="utility:filterList" size="x-small"></lightning-icon>
                                <template if:true={activeDropdownFilterCount}>
                                    <span class="filter-funnel-badge">{activeDropdownFilterCount}</span>
                                </template>
                            </button>
                        </div>

                        <template if:true={showCompactFilterSummary}>
                            <div class="active-filter-row">
                                <template for:each={activeFilterChips} for:item="chip">
                                    <span key={chip.key} class="active-filter-chip">{chip.label}</span>
                                </template>
                                <button class="clear-filters-link" type="button" onclick={handleClearAccountFilters}>
                                    Clear
                                </button>
                            </div>
                        </template>
                        <div class="account-count-label">{accountCountLabel}</div>
                        <template if:true={canSaveFilterAsCollection}>
                            <button type="button" class="save-collection-link" onclick={handleOpenSaveCollectionModal}>
                                Save filter as list
                            </button>
                        </template>
                    </div>

                    <div class="account-collections">
                        <div class="sidebar-section-title collections-section-title">My lists</div>
                        <div class="collection-chips-row">
                            <button type="button" class={allAccountsChipClass} onclick={handleShowAllAccounts}>
                                All accounts
                            </button>
                            <template for:each={collectionChips} for:item="col">
                                <button
                                    key={col.id}
                                    type="button"
                                    class={col.chipClass}
                                    data-collection-id={col.id}
                                    onclick={handleSelectCollection}
                                    title={col.title}
                                    ondragover={handleCollectionChipDragOver}
                                    ondrop={handleCollectionChipDrop}
                                >
                                    {col.label}
                                </button>
                            </template>
                            <button
                                type="button"
                                class="collection-chip collection-chip-add"
                                title="New empty list"
                                onclick={handleCreateEmptyCollection}
                            >
                                +
                            </button>
                        </div>
                        <template if:true={showCollectionDropZone}>
                            <div
                                class="collection-drop-zone"
                                ondragover={handleCollectionDropZoneDragOver}
                                ondrop={handleCollectionDropZoneDrop}
                            >
                                Drop accounts here to add to “{selectedCollectionName}”
                            </div>
                            <div class="collection-actions">
                                <button type="button" class="rename-collection-link" onclick={handleOpenRenameCollectionModal}>
                                    Rename list
                                </button>
                                <span class="collection-actions-separator" aria-hidden="true">·</span>
                                <button type="button" class="delete-collection-link" onclick={handleDeleteSelectedCollection}>
                                    Delete list
                                </button>
                            </div>
                        </template>
                    </div>

                    <div class="account-list" style={accountListStyle} onscroll={handleAccountListScroll}>
                        <template for:each={displayAccounts} for:item="account">
                            <div
                                key={account.id}
                                class={account.chipClass}
                                title={account.chipTitle}
                                draggable={accountChipDraggable}
                                data-account-id={account.id}
                                onclick={handleAccountChipClick}
                                ondragstart={handleAccountDragStart}
                                ondragend={handleSidebarDragEnd}
                                ontouchstart={handleAccountTouchStart}
                            >
                                <span class="account-chip-name">{account.name}</span>
                                <span class="account-chip-meta">{account.metaLine}</span>
                                <template if:true={account.footnoteLine}>
                                    <span class="account-card-footnote">{account.footnoteLine}</span>
                                </template>
                            </div>
                        </template>
                        <template if:true={isLoadingAccounts}>
                            <div class="account-loading">
                                <lightning-spinner alternative-text="Loading accounts" size="small"></lightning-spinner>
                            </div>
                        </template>
                        <template if:false={hasAccounts}>
                            <template if:false={isLoadingAccounts}>
                                <div class="empty-hint">{emptyAccountsHint}</div>
                            </template>
                        </template>
                    </div>
                </aside>

                <section class="planner-main">
                    <template if:true={showAccountFilterPanel}>
                        <div class="main-overlay-backdrop" onclick={handleCloseAccountFilters}></div>
                        <div class="main-overlay-panel account-filter-panel" onclick={handleFilterPanelClick}>
                            <div class="account-filter-panel-header">
                                <span class="account-filter-panel-title">Filter accounts</span>
                                <button
                                    type="button"
                                    class="account-filter-panel-close"
                                    title="Close filters"
                                    onclick={handleCloseAccountFilters}
                                >
                                    <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="account-filter-panel-body">
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Record type</label>
                                    <lightning-combobox
                                        label="Record type"
                                        variant="label-hidden"
                                        placeholder="All types"
                                        value={accountRecordType}
                                        options={recordTypeOptions}
                                        onchange={handleRecordTypeChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Specialty</label>
                                    <lightning-combobox
                                        label="Specialty"
                                        variant="label-hidden"
                                        placeholder="All specialties"
                                        value={accountSpecialty}
                                        options={specialtyOptions}
                                        onchange={handleSpecialtyChange}
                                        disabled={specialtyFilterDisabled}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Classification</label>
                                    <lightning-combobox
                                        label="Classification"
                                        variant="label-hidden"
                                        placeholder="All classes"
                                        value={accountClassification}
                                        options={classificationOptions}
                                        onchange={handleClassificationChange}
                                        disabled={classificationFilterDisabled}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Brick</label>
                                    <lightning-combobox
                                        label="Brick"
                                        variant="label-hidden"
                                        placeholder="All bricks"
                                        value={accountBrick}
                                        options={brickOptions}
                                        onchange={handleBrickChange}
                                        disabled={brickFilterDisabled}
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="account-filter-panel-footer">
                                <button type="button" class="clear-filters-link" onclick={handleClearAccountFilters}>
                                    Clear all
                                </button>
                                <lightning-button
                                    label="Done"
                                    variant="brand"
                                    onclick={handleCloseAccountFilters}
                                ></lightning-button>
                            </div>
                        </div>
                    </template>

                    <template if:true={showPlanningPalettePanel}>
                        <div
                            class="main-overlay-backdrop"
                            onclick={handleClosePlanningPalette}
                            ondragover={handleDragOver}
                            ondrop={handleCalendarDrop}
                        ></div>
                        <div class="main-overlay-panel planning-palette-panel" onclick={handleFilterPanelClick}>
                            <div class="account-filter-panel-header">
                                <span class="account-filter-panel-title">Add to calendar</span>
                                <button
                                    type="button"
                                    class="account-filter-panel-close"
                                    title="Close"
                                    onclick={handleClosePlanningPalette}
                                >
                                    <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="planning-palette-body">
                                <div class="planning-palette-section-title">Time Off (TOT)</div>
                                <div class="sidebar-helper-text">Drag a preset to submit instantly, or use Custom for more options.</div>
                                <div class="tot-quick-grid">
                                    <template for:each={totQuickPresets} for:item="preset">
                                        <div
                                            key={preset.id}
                                            class="tot-quick-item"
                                            draggable="true"
                                            data-preset-id={preset.id}
                                            data-drag-type="tot"
                                            ondragstart={handleQuickTotDragStart}
                                            ondragend={handleSidebarDragEnd}
                                            ontouchstart={handleQuickTotTouchStart}
                                            onclick={handleTotPresetClick}
                                        >
                                            {preset.label}
                                        </div>
                                    </template>
                                </div>
                                <div
                                    class="tot-palette-item tot-palette-item-custom"
                                    draggable="true"
                                    data-drag-type="tot"
                                    ondragstart={handleTotDragStart}
                                    ondragend={handleSidebarDragEnd}
                                    ontouchstart={handleTotTouchStart}
                                    onclick={handleCustomTotClick}
                                >
                                    Custom TOT…
                                </div>
                            </div>
                            <div class="account-filter-panel-footer">
                                <span class="planning-palette-hint">Drag items onto the calendar to schedule.</span>
                                <lightning-button
                                    label="Done"
                                    variant="brand"
                                    onclick={handleClosePlanningPalette}
                                ></lightning-button>
                            </div>
                        </div>
                    </template>
                    <template if:true={isCalendarView}>
                        <div class="calendar-view">
                            <div
                                class="calendar-scroll"
                                ondragover={handleDragOver}
                                ondrop={handleCalendarDrop}
                                ontouchmove={handleCalendarTouchMove}
                            >
                                <div class="calendar-canvas" style={gridStyle}>
                                <div class="calendar-grid">
                                    <div class="calendar-header-cell"></div>
                                    <template for:each={weekDays} for:item="day">
                                        <div key={day.key} class={day.headerClass}>
                                            <div>{day.label}</div>
                                            <div class="slds-text-body_small">{day.dateLabel}</div>
                                        </div>
                                    </template>

                                    <template for:each={timeRows} for:item="row">
                                        <template if:true={row.isDayEnd}>
                                            <div key={row.key} class={row.gutterClass} style={row.style}>
                                                <span class="time-gutter-label">{row.label}</span>
                                            </div>
                                        </template>
                                        <template if:false={row.isDayEnd}>
                                            <div key={row.key} class={row.gutterClass} style={row.style}>{row.label}</div>
                                        </template>
                                        <template for:each={row.dayCells} for:item="cell">
                                            <div
                                                key={cell.key}
                                                class={cell.columnClass}
                                                style={cell.style}
                                                data-day-key={cell.dayKey}
                                                data-minutes={cell.minutes}
                                                onclick={handleSlotClick}
                                            ></div>
                                        </template>
                                    </template>

                                </div>
                                <div class="calendar-events-layer">
                                    <template for:each={calendarEvents} for:item="event">
                                        <div
                                            key={event.key}
                                            class={event.blockClass}
                                            style={event.style}
                                            draggable={event.draggable}
                                            data-event-id={event.id}
                                            data-event-type={event.type}
                                            title={event.clickHint}
                                            ondragstart={handleEventDragStart}
                                            ondragend={handleEventDragEnd}
                                            onclick={handleEventClick}
                                        >
                                            <div class="event-title">
                                                <template if:true={event.showOutlierWarning}>
                                                    <span class="calendar-outlier-indicator" title="Far from other stops on this day">!</span>
                                                </template>
                                                {event.title}
                                            </div>
                                            <template if:false={event.compact}>
                                                <div class="event-time">{event.timeLabel}</div>
                                            </template>
                                            <template if:true={event.resizable}>
                                                <div
                                                    class="resize-handle"
                                                    data-event-id={event.id}
                                                    onmousedown={handleResizeStart}
                                                ></div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={isMapView}>
                        <div class="map-view">
                            <div class="map-layout">
                                <div class="map-container" lwc:dom="manual"></div>
                                <div class="map-sidebar">
                                    <div class="sidebar-section-title">Route stops</div>
                                    <div class="map-account-count">{mapAccountCountLabel}</div>
                                    <template if:true={hasRouteOutliers}>
                                        <div class="route-suggestion-card route-outlier-card">
                                            <div class="route-suggestion-title">Distant stops</div>
                                            <p class="route-outlier-summary">{distantStopsSummary}</p>
                                            <ul class="route-suggestion-hints">
                                                <template for:each={decoratedRouteOutliers} for:item="outlier">
                                                    <li key={outlier.visitId} class="route-outlier-item">
                                                        <div>
                                                            <strong>{outlier.accountName}</strong> — {outlier.awayLabel}
                                                        </div>
                                                        <template if:true={outlier.canAct}>
                                                            <div class="route-stop-actions slds-m-top_x-small">
                                                                <lightning-button
                                                                    variant="neutral"
                                                                    label="Postpone to tomorrow"
                                                                    data-visit-id={outlier.visitId}
                                                                    onclick={handleRouteStopPostpone}
                                                                    disabled={isSaving}
                                                                ></lightning-button>
                                                                <lightning-button
                                                                    variant="destructive-text"
                                                                    label="Remove visit"
                                                                    data-visit-id={outlier.visitId}
                                                                    onclick={handleRouteStopRemove}
                                                                    disabled={isSaving}
                                                                ></lightning-button>
                                                            </div>
                                                        </template>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                    <template if:true={hasOptimizationIdeas}>
                                        <div class="ideas-panel map-ideas-panel">
                                            <div class="route-suggestion-title">Optimization ideas</div>
                                            <ul class="ideas-list">
                                                <template for:each={optimizationIdeas} for:item="idea">
                                                    <li key={idea.id} class={idea.itemClass}>
                                                        <lightning-icon
                                                            icon-name={idea.iconName}
                                                            size="x-small"
                                                            class={idea.iconClass}
                                                            alternative-text="Tip"
                                                        ></lightning-icon>
                                                        <div class="ideas-content">
                                                            <span class="ideas-text">{idea.text}</span>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                    <template for:each={sidebarRouteStops} for:item="stop">
                                        <div
                                            key={stop.id}
                                            class={stop.stopClass}
                                            data-stop-id={stop.id}
                                            onclick={handleRouteStopClick}
                                        >
                                            <template if:true={stop.canReorder}>
                                                <div class="route-reorder-buttons">
                                                    <lightning-button-icon
                                                        icon-name="utility:up"
                                                        alternative-text="Move up"
                                                        data-visit-id={stop.id}
                                                        data-direction="up"
                                                        onclick={handleMoveRouteStop}
                                                        disabled={stop.moveUpDisabled}
                                                        variant="bare"
                                                        size="small"
                                                    ></lightning-button-icon>
                                                    <lightning-button-icon
                                                        icon-name="utility:down"
                                                        alternative-text="Move down"
                                                        data-visit-id={stop.id}
                                                        data-direction="down"
                                                        onclick={handleMoveRouteStop}
                                                        disabled={stop.moveDownDisabled}
                                                        variant="bare"
                                                        size="small"
                                                    ></lightning-button-icon>
                                                </div>
                                            </template>
                                            <span class={stop.orderClass}>{stop.orderLabel}</span>
                                            <div class="route-stop-body">
                                                <div class="slds-text-title_caps">{stop.accountName}</div>
                                                <template if:false={stop.isCurrentLocation}>
                                                    <div class="route-stop-type">{stop.accountTypeLabel}</div>
                                                </template>
                                                <div>{stop.timeLabel}</div>
                                                <template if:true={stop.arrivalStatusLabel}>
                                                    <div class={stop.arrivalStatusClass}>{stop.arrivalStatusLabel}</div>
                                                </template>
                                                <template if:true={stop.isOutlier}>
                                                    <div class="route-outlier-badge">Route outlier</div>
                                                </template>
                                                <template if:false={stop.hasLocation}>
                                                    <div class="slds-text-color_error">No geocode on account</div>
                                                </template>
                                                <template if:true={stop.canMutate}>
                                                    <div class="route-stop-actions slds-m-top_x-small">
                                                        <lightning-button
                                                            variant="base"
                                                            label="Postpone"
                                                            data-visit-id={stop.id}
                                                            onclick={handleRouteStopPostpone}
                                                            disabled={isSaving}
                                                        ></lightning-button>
                                                        <lightning-button
                                                            variant="base"
                                                            label="Remove"
                                                            data-visit-id={stop.id}
                                                            onclick={handleRouteStopRemove}
                                                            disabled={isSaving}
                                                        ></lightning-button>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={hasRouteOptimization}>
                                        <div class="route-suggestion-card">
                                            <div class="route-suggestion-title">Suggested route order</div>
                                            <div class="route-suggestion-savings">
                                                Saves <strong>{routeOptimization.savingsMin}</strong> min
                                                (<strong>{routeOptimization.savingsKm}</strong> km)
                                            </div>
                                            <ul class="route-suggestion-hints">
                                                <template for:each={routeOptimization.swapHints} for:item="hint">
                                                    <li key={hint}>{hint}</li>
                                                </template>
                                            </ul>
                                            <lightning-button
                                                class="slds-m-top_x-small"
                                                label="Apply suggested order"
                                                variant="brand"
                                                onclick={handleApplySuggestedOrder}
                                                disabled={isUpdatingRoute}
                                            ></lightning-button>
                                        </div>
                                    </template>
                                    <template if:false={hasMapStops}>
                                        <div class="empty-hint">No geocoded visits on this day.</div>
                                    </template>
                                    <template if:true={routeSummary}>
                                        <div class="route-summary">
                                            <div><strong>Route:</strong> {routeSummary.distanceKm} km · {routeSummary.durationMin} min drive</div>
                                            <template if:true={hasRouteEstCost}>
                                                <div class="slds-m-top_xx-small">Est. cost: {routeSummary.estCost}</div>
                                            </template>
                                            <div class="slds-m-top_x-small arrival-summary">{arrivalSummaryLabel}</div>
                                        </div>
                                    </template>
                                    <template if:true={hasRouteAlternatives}>
                                        <div class="route-options-card">
                                            <div class="route-suggestion-title">Route options</div>
                                            <lightning-radio-group
                                                options={routeAlternativeRadioOptions}
                                                value={selectedRouteId}
                                                type="radio"
                                                onchange={handleRouteAlternativeChange}
                                            ></lightning-radio-group>
                                        </div>
                                    </template>
                                    <template if:true={hasVisitSuggestions}>
                                        <div class="visit-suggestions-card">
                                            <div class="route-suggestion-title">Suggested visits</div>
                                            <template for:each={visitSuggestions} for:item="suggestion">
                                                <div key={suggestion.id} class="visit-suggestion-item">
                                                    <div class="slds-text-title_caps">{suggestion.accountName}</div>
                                                    <div>{suggestion.placementLabel} · +{suggestion.detourMin} min</div>
                                                    <div>{suggestion.visitGapLabel} · {suggestion.frequencyStatus}</div>
                                                    <div class="slds-m-top_x-small">
                                                        <lightning-button
                                                            label="Add to route"
                                                            data-account-id={suggestion.accountId}
                                                            onclick={handleAddSuggestionToRoute}
                                                        ></lightning-button>
                                                        <lightning-button
                                                            class="slds-m-left_x-small"
                                                            label="Plan visit"
                                                            data-account-id={suggestion.accountId}
                                                            onclick={handlePlanSuggestionVisit}
                                                        ></lightning-button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="slds-m-top_medium slds-text-body_small map-legend">
                                        <span class="legend-dot" style="background:#0176d3"></span> You
                                        <span class="legend-pin legend-pin-hcp slds-m-left_small"></span> Planned HCP
                                        <span class="legend-pin legend-pin-hco slds-m-left_small"></span> Planned HCO
                                        <span class="legend-pin legend-pin-outlier slds-m-left_small"></span> Outlier
                                        <span class="legend-pin legend-pin-unplanned slds-m-left_small"></span> Unplanned
                                        <span class="legend-dot slds-m-left_small" style="background:#2e7d32"></span> Route
                                        <span class="legend-dot slds-m-left_small legend-dot-alt"></span> Alt route
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </section>
            </div>
        </div>

        <template if:true={showVisitDetailModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan Visit</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-title_caps slds-m-bottom_x-small">{visitDetailAccountName}</p>
                        <p class="slds-m-bottom_medium">
                            <strong>When:</strong> {visitDetailStartLabel} – {visitDetailEndLabel}
                        </p>
                        <lightning-combobox
                            label="Status"
                            value={visitDetailStatus}
                            options={visitStatusOptions}
                            onchange={handleVisitDetailStatusChange}
                            disabled={visitDetailReadOnly}
                            required
                        ></lightning-combobox>
                        <template if:true={visitShowCancellationReason}>
                            <lightning-textarea
                                class="slds-m-top_small"
                                label="Cancellation Reason"
                                value={visitDetailCancellationReason}
                                onchange={handleVisitDetailCancellationChange}
                                disabled={visitDetailReadOnly}
                                required
                            ></lightning-textarea>
                        </template>
                        <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                            Drag accounts onto the calendar to create draft visits. Open a visit here to schedule, complete, or cancel it.
                        </p>
                    </div>
                    <footer class="slds-modal__footer">
                        <template if:true={visitDetailCanMutate}>
                            <lightning-button
                                label="Remove visit"
                                variant="destructive-text"
                                onclick={handleVisitDetailRemove}
                                disabled={isSaving}
                            ></lightning-button>
                            <lightning-button
                                class="slds-m-left_x-small"
                                label="Postpone to tomorrow"
                                onclick={handleVisitDetailPostpone}
                                disabled={isSaving}
                            ></lightning-button>
                        </template>
                        <lightning-button label="Close" onclick={handleVisitDetailCancel}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="View Visit"
                            variant="brand"
                            onclick={handleViewVisit}
                        ></lightning-button>
                        <template if:false={visitDetailReadOnly}>
                            <template if:true={visitDetailCanSubmit}>
                                <lightning-button
                                    class="slds-m-left_x-small"
                                    label="Submit for approval"
                                    variant="brand"
                                    onclick={handleSubmitVisitForApproval}
                                    disabled={isSaving}
                                ></lightning-button>
                            </template>
                            <lightning-button
                                class="slds-m-left_x-small"
                                label="Save"
                                onclick={handleVisitDetailSave}
                                disabled={isSaving}
                            ></lightning-button>
                        </template>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showPlanChoiceModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container plan-choice-modal">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan this time slot</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_medium">{pendingSlotLabel}</p>
                        <p class="slds-text-body_regular slds-m-bottom_medium">What would you like to schedule?</p>
                        <div class="plan-choice-actions">
                            <lightning-button
                                class="plan-choice-button"
                                label="Plan a Visit"
                                icon-name="utility:event"
                                onclick={handlePlanVisitChoice}
                            ></lightning-button>
                            <lightning-button
                                class="plan-choice-button"
                                label="Time Off (TOT)"
                                icon-name="utility:away"
                                onclick={handlePlanTotChoice}
                            ></lightning-button>
                            <lightning-button
                                class="plan-choice-button"
                                label="Meeting"
                                icon-name="utility:groups"
                                onclick={handlePlanMeetingChoice}
                            ></lightning-button>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handlePlanChoiceCancel}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showVisitModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan a Visit</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            <strong>Start:</strong> {pendingSlotLabel}
                            <span class="slds-m-left_small"><strong>End:</strong> {visitEndLabel}</span>
                        </p>
                        <lightning-input
                            type="search"
                            label="Search HCP / HCO"
                            placeholder="Type to search accounts..."
                            value={visitAccountSearch}
                            onchange={handleVisitAccountSearch}
                        ></lightning-input>
                        <lightning-combobox
                            class="slds-m-top_small"
                            label="Account"
                            placeholder="Select an HCP or HCO"
                            value={visitAccountId}
                            options={visitAccountOptions}
                            onchange={handleVisitAccountChange}
                            required
                        ></lightning-combobox>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleVisitCancel}></lightning-button>
                        <lightning-button label="Save Visit" variant="brand" onclick={handleVisitSave} disabled={isSaving}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showVisitPickerModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Select a visit</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small slds-text-body_regular">
                            Multiple visits are scheduled for this account. Choose one to open.
                        </p>
                        <ul class="visit-picker-list">
                            <template for:each={visitPickerOptions} for:item="option">
                                <li key={option.id} class="visit-picker-item">
                                    <button
                                        class="visit-picker-button"
                                        data-visit-id={option.id}
                                        onclick={handleVisitPickerSelect}
                                    >
                                        <span class="visit-picker-label">{option.label}</span>
                                        <span class="visit-picker-status">{option.status}</span>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleVisitPickerCancel}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showTotModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container tot-modal">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Create Time Off (TOT)</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
                            Pick a quick preset or adjust the details below, then submit.
                        </p>
                        <div class="tot-preset-row">
                            <template for:each={totQuickPresets} for:item="preset">
                                <button
                                    key={preset.id}
                                    type="button"
                                    class="tot-preset-chip"
                                    data-preset-id={preset.id}
                                    onclick={handleTotPresetClick}
                                >
                                    {preset.label}
                                </button>
                            </template>
                        </div>
                        <lightning-combobox
                            data-tot-field="type"
                            label="Type"
                            value={totTypeValue}
                            options={totTypeOptions}
                            onchange={handleTotTypeChange}
                            required
                        ></lightning-combobox>
                        <lightning-combobox
                            data-tot-field="span"
                            class="slds-m-top_small"
                            label="Span"
                            value={totSpanType}
                            options={totSpanOptions}
                            onchange={handleTotSpanChange}
                            required
                        ></lightning-combobox>
                        <template if:true={totIsHoursSpan}>
                            <lightning-combobox
                                data-tot-field="duration"
                                class="slds-m-top_small"
                                label="Duration (hours)"
                                value={totDurationHours}
                                options={totDurationOptions}
                                onchange={handleTotDurationChange}
                                required
                            ></lightning-combobox>
                            <lightning-input
                                data-tot-field="start-datetime"
                                class="slds-m-top_small"
                                type="datetime"
                                label="Start date &amp; time"
                                value={totStartDateTime}
                                onchange={handleTotStartChange}
                                required
                            ></lightning-input>
                        </template>
                        <template if:true={totIsFullDaySpan}>
                            <lightning-input
                                data-tot-field="start-date"
                                class="slds-m-top_small"
                                type="date"
                                label="Date"
                                value={totStartDate}
                                onchange={handleTotStartDateChange}
                                required
                            ></lightning-input>
                        </template>
                        <lightning-textarea
                            class="slds-m-top_small"
                            label="Comments"
                            value={totComments}
                            onchange={handleTotCommentsChange}
                        ></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleTotCancel}></lightning-button>
                        <lightning-button label="Save Draft" onclick={handleTotSaveDraft} disabled={isSaving}></lightning-button>
                        <lightning-button label="Submit" variant="brand" onclick={handleTotSubmit} disabled={totSubmitDisabled}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showRenameCollectionModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container save-collection-modal">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Rename account list</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            label="List name"
                            placeholder="e.g. Tier A HCPs in Cairo"
                            value={renameCollectionName}
                            onchange={handleRenameCollectionNameChange}
                            required
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleRenameCollectionCancel}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Save"
                            variant="brand"
                            onclick={handleRenameCollectionConfirm}
                            disabled={isRenameCollectionDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showSaveCollectionModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container save-collection-modal">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Save as account list</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small slds-text-body_small">
                            Saves all accounts matching your current filters ({saveCollectionAccountCountLabel}).
                        </p>
                        <lightning-input
                            label="List name"
                            placeholder="e.g. Tier A HCPs in Cairo"
                            value={saveCollectionName}
                            onchange={handleSaveCollectionNameChange}
                            required
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleSaveCollectionCancel}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Save list"
                            variant="brand"
                            onclick={handleSaveCollectionConfirm}
                            disabled={isSaveCollectionDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showPromoModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan Promotional Event</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            <strong>Start:</strong> {pendingSlotLabel}
                            <span class="slds-m-left_small"><strong>End:</strong> {promoEndLabel}</span>
                        </p>
                        <lightning-combobox
                            label="Promotional project"
                            placeholder="Select a project"
                            value={promoProjectId}
                            options={promoProjectOptions}
                            onchange={handlePromoProjectChange}
                            required
                        ></lightning-combobox>
                        <lightning-input
                            class="slds-m-top_small"
                            label="Event title"
                            placeholder="e.g. Pharmacy open day, product launch"
                            value={promoTitle}
                            onchange={handlePromoTitleChange}
                            required
                        ></lightning-input>
                        <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                            Promotional events appear on your calendar and link to the selected project.
                        </p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handlePromoCancel}></lightning-button>
                        <lightning-button
                            label="Save Event"
                            variant="brand"
                            onclick={handlePromoSave}
                            disabled={isPromoSaveDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showMeetingModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan a Meeting</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            <strong>Start:</strong> {pendingSlotLabel}
                            <span class="slds-m-left_small"><strong>End:</strong> {meetingEndLabel}</span>
                        </p>
                        <lightning-combobox
                            label="Meeting type"
                            placeholder="Select a type"
                            value={meetingRecordType}
                            options={meetingRecordTypeOptions}
                            onchange={handleMeetingRecordTypeChange}
                            required
                        ></lightning-combobox>
                        <lightning-input
                            class="slds-m-top_small"
                            label="Meeting title"
                            placeholder="e.g. Regional speaker dinner, RTD kickoff"
                            value={meetingTitle}
                            onchange={handleMeetingTitleChange}
                            required
                        ></lightning-input>
                        <lightning-combobox
                            class="slds-m-top_small"
                            label="Project (optional)"
                            placeholder="Link to a project"
                            value={meetingProjectId}
                            options={promoProjectOptions}
                            onchange={handleMeetingProjectChange}
                        ></lightning-combobox>
                        <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                            Creates a Draft Meeting on your calendar. Open it to manage members, expenses, and approval.
                        </p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleMeetingCancel}></lightning-button>
                        <lightning-button
                            label="Save Meeting"
                            variant="brand"
                            onclick={handleMeetingSave}
                            disabled={isMeetingSaveDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
