<template>
    <section class="territory-console">
        <header class="console-header">
            <p class="console-subtitle">
                Manage Pharma product lines, territory hierarchy, and field force users.
            </p>
        </header>

        <lightning-tabset active-tab-value={activeTab} onselect={handleTabChange}>
            <lightning-tab label="Product Lines" value="lines">
                <div class="tab-toolbar">
                    <lightning-button label="Add Product Line" variant="brand" onclick={handleAddLine}></lightning-button>
                </div>
                <template if:true={hasLineRows}>
                    <div class="line-grid">
                        <template for:each={lineRows} for:item="line">
                            <article key={line.id} class={line.cardClass}>
                                <div class="line-card-header">
                                    <h3 class="line-name">{line.name}</h3>
                                    <span class="line-code">{line.externalId}</span>
                                </div>
                                <p class="line-therapy">{line.therapyLabel}</p>
                                <p class="line-type-breakdown">{line.typeBreakdown}</p>
                                <div class="line-stats">
                                    <span>{line.districtCount} districts</span>
                                    <span>{line.repCount} reps</span>
                                    <span>{line.productCount} products</span>
                                </div>
                                <div class="line-actions">
                                    <lightning-button
                                        label="Manage Products"
                                        variant="brand"
                                        data-id={line.id}
                                        onclick={handleManageLineProducts}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Edit Line"
                                        data-id={line.id}
                                        onclick={handleEditLine}
                                    ></lightning-button>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>
                <template if:false={hasLineRows}>
                    <div class="empty-state">
                        <p>No product lines found. Run territory seeding or add a new line.</p>
                    </div>
                </template>
            </lightning-tab>

            <lightning-tab label="Territories" value="territories">
                <div class="tab-toolbar">
                    <lightning-button label="Add Territory" onclick={handleAddTerritory}></lightning-button>
                </div>
                <template if:true={hasRows}>
                    <table class="territory-table">
                        <thead>
                            <tr>
                                <th>Territory</th>
                                <th>Level</th>
                                <th>Assigned User</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={flatRows} for:item="row">
                                <tr key={row.key}>
                                    <td>
                                        <div class="territory-name-cell" style={row.depthStyle}>
                                            <template if:true={row.hasChildren}>
                                                <button
                                                    class="toggle-btn"
                                                    data-id={row.id}
                                                    onclick={handleToggle}
                                                    title="Expand or collapse"
                                                >
                                                    <lightning-icon
                                                        icon-name={row.chevronIcon}
                                                        size="x-small"
                                                    ></lightning-icon>
                                                </button>
                                            </template>
                                            <template if:false={row.hasChildren}>
                                                <span class="toggle-spacer"></span>
                                            </template>
                                            <div class="territory-labels">
                                                <span class="territory-name">{row.name}</span>
                                                <span class="territory-ext">{row.externalId}</span>
                                            </div>
                                        </div>
                                    </td>
                                    <td><span class="level-badge">{row.level}</span></td>
                                    <td>{row.assignmentLabel}</td>
                                    <td>
                                        <span class={row.vacantClass}>{row.vacantLabel}</span>
                                    </td>
                                    <td class="actions">
                                        <template if:true={row.canEdit}>
                                            <lightning-button
                                                label="Edit"
                                                data-id={row.id}
                                                onclick={handleEditTerritory}
                                            ></lightning-button>
                                        </template>
                                        <template if:true={row.canAddChild}>
                                            <lightning-button
                                                label="Add Child"
                                                data-id={row.id}
                                                onclick={handleAddChildTerritory}
                                            ></lightning-button>
                                        </template>
                                        <lightning-button
                                            label="Assign"
                                            data-id={row.id}
                                            data-name={row.name}
                                            onclick={handleAssign}
                                        ></lightning-button>
                                        <lightning-button
                                            label="Vacant"
                                            data-id={row.id}
                                            data-name={row.name}
                                            onclick={handleMakeVacant}
                                        ></lightning-button>
                                        <template if:true={row.canDelete}>
                                            <lightning-button
                                                label="Delete"
                                                variant="destructive-text"
                                                data-id={row.id}
                                                data-name={row.name}
                                                onclick={handleDeleteTerritory}
                                            ></lightning-button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasRows}>
                    <div class="empty-state">
                        <p>No territories found. Run territory seeding to populate the hierarchy.</p>
                    </div>
                </template>
            </lightning-tab>

            <lightning-tab label="Users" value="users">
                <div class="tab-toolbar">
                    <lightning-input
                        type="search"
                        label="Search users"
                        value={userSearchTerm}
                        onchange={handleUserSearch}
                    ></lightning-input>
                    <div class="toolbar-actions">
                        <lightning-button
                            label="Set OTP Password"
                            disabled={isSaving}
                            onclick={handleOpenPasswordForSelected}
                        ></lightning-button>
                        <lightning-button
                            label="Activate Selected"
                            disabled={isSaving}
                            onclick={handleBulkActivate}
                        ></lightning-button>
                        <lightning-button
                            label="Deactivate Selected"
                            disabled={isSaving}
                            onclick={handleBulkDeactivate}
                        ></lightning-button>
                        <lightning-button label="Create User" variant="brand" onclick={handleOpenUserModal}></lightning-button>
                    </div>
                </div>
                <template if:true={hasSelectedUsers}>
                    <p class="selection-hint">{selectedUserCount} user(s) selected</p>
                </template>
                <template if:true={hasUsers}>
                    <table class="territory-table">
                        <thead>
                            <tr>
                                <th class="col-check">
                                    <lightning-input
                                        type="checkbox"
                                        checked={isAllUsersSelected}
                                        onchange={handleSelectAllUsers}
                                        variant="label-hidden"
                                        label="Select all users"
                                    ></lightning-input>
                                </th>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Title</th>
                                <th>Profile</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={userRows} for:item="user">
                                <tr key={user.id}>
                                    <td class="col-check">
                                        <lightning-input
                                            type="checkbox"
                                            checked={user.selected}
                                            data-id={user.id}
                                            onchange={handleToggleUserSelection}
                                            variant="label-hidden"
                                            label="Select user"
                                        ></lightning-input>
                                    </td>
                                    <td>{user.name}</td>
                                    <td>{user.username}</td>
                                    <td>{user.email}</td>
                                    <td>{user.title}</td>
                                    <td>{user.profileName}</td>
                                    <td>
                                        <span class={user.statusClass}>{user.statusLabel}</span>
                                    </td>
                                    <td class="actions actions-row">
                                        <lightning-button
                                            label="Edit"
                                            data-id={user.id}
                                            onclick={handleEditProfile}
                                        ></lightning-button>
                                        <lightning-button
                                            label="OTP Password"
                                            data-id={user.id}
                                            onclick={handleOpenPasswordForUser}
                                        ></lightning-button>
                                        <lightning-button
                                            label={user.activateLabel}
                                            data-id={user.id}
                                            onclick={handleToggleUserActive}
                                        ></lightning-button>
                                        <lightning-button-icon
                                            icon-name="utility:new_window"
                                            alternative-text="View user record"
                                            title="View user record"
                                            variant="border-filled"
                                            data-id={user.id}
                                            onclick={handleViewUserRecord}
                                        ></lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasUsers}>
                    <div class="empty-state">
                        <p>No pharma users found. Create a demo user or run territory seeding.</p>
                    </div>
                </template>
            </lightning-tab>
        </lightning-tabset>

        <template if:true={showAssignModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Assign user to territory">
                <div class="modal-backdrop" onclick={handleCloseAssign}></div>
                <div class="modal-panel">
                    <h3 class="modal-title">Assign User — {assignTerritoryName}</h3>
                    <lightning-input
                        type="search"
                        label="Search users"
                        value={assignUserSearchTerm}
                        onchange={handleAssignUserSearch}
                    ></lightning-input>
                    <lightning-combobox
                        label="User"
                        value={selectedUserId}
                        options={assignUserOptions}
                        placeholder="Select a user"
                        onchange={handleUserSelect}
                    ></lightning-combobox>
                    <div class="modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseAssign}></lightning-button>
                        <lightning-button
                            label="Assign"
                            variant="brand"
                            disabled={isAssignDisabled}
                            onclick={handleConfirmAssign}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={showTerritoryModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Territory editor">
                <div class="modal-backdrop" onclick={handleCloseTerritoryModal}></div>
                <div class="modal-panel">
                    <h3 class="modal-title">{territoryModalTitle}</h3>
                    <lightning-input
                        label="Territory Name"
                        value={draftTerritory.name}
                        data-field="name"
                        onchange={handleTerritoryFieldChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="External Id"
                        value={draftTerritory.externalId}
                        data-field="externalId"
                        onchange={handleTerritoryFieldChange}
                        disabled={draftTerritory.recordId}
                    ></lightning-input>
                    <template if:false={draftTerritory.recordId}>
                        <lightning-combobox
                            label="Level"
                            value={draftTerritory.level}
                            options={levelOptions}
                            data-field="level"
                            onchange={handleTerritoryFieldChange}
                        ></lightning-combobox>
                        <lightning-combobox
                            label="Parent Territory"
                            value={draftTerritory.parentId}
                            options={parentOptions}
                            data-field="parentId"
                            onchange={handleTerritoryFieldChange}
                        ></lightning-combobox>
                    </template>
                    <div class="modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseTerritoryModal}></lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            disabled={isTerritorySaveDisabled}
                            onclick={handleSaveTerritory}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={showLineModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Create product line">
                <div class="modal-backdrop" onclick={handleCloseLineModal}></div>
                <div class="modal-panel">
                    <h3 class="modal-title">Add Product Line</h3>
                    <p class="modal-help">
                        Creates a line under Head Office plus a default district and MR territory. Products matching the therapy area are auto-aligned.
                    </p>
                    <lightning-input
                        label="Line Name"
                        value={draftLine.name}
                        data-field="name"
                        onchange={handleLineFieldChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Line Code"
                        value={draftLine.code}
                        data-field="code"
                        onchange={handleLineFieldChange}
                        placeholder="e.g. CARDIO"
                        required
                    ></lightning-input>
                    <lightning-combobox
                        label="Therapy Area"
                        value={draftLine.therapyArea}
                        options={therapyAreaOptions}
                        data-field="therapyArea"
                        onchange={handleLineFieldChange}
                    ></lightning-combobox>
                    <div class="modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseLineModal}></lightning-button>
                        <lightning-button
                            label="Create Line"
                            variant="brand"
                            disabled={isLineSaveDisabled}
                            onclick={handleSaveLine}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={showManageProductsModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Manage line products">
                <div class="modal-backdrop" onclick={handleCloseManageProductsModal}></div>
                <div class="modal-panel modal-panel-wide">
                    <h3 class="modal-title">{manageProductsTitle}</h3>
                    <p class="modal-help">
                        Products are linked by onboarding fields Sales Line and Mirror Line (Brand / Detail / Sample / Brand Reminder).
                    </p>

                    <div class="tab-toolbar">
                        <lightning-input
                            type="search"
                            label="Filter linked products"
                            value={lineProductSearchTerm}
                            onchange={handleLineProductSearch}
                        ></lightning-input>
                        <lightning-combobox
                            label="Product type"
                            value={lineProductTypeFilter}
                            options={productTypeFilterOptions}
                            onchange={handleLineProductTypeFilter}
                        ></lightning-combobox>
                    </div>

                    <template if:true={isLoadingLineProducts}>
                        <p class="modal-help">Loading products…</p>
                    </template>
                    <template if:true={hasFilteredLineProducts}>
                        <table class="territory-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Code</th>
                                    <th>Type</th>
                                    <th>Brand</th>
                                    <th>Sales Line</th>
                                    <th>Mirror</th>
                                    <th>Link</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredLineProductRows} for:item="product">
                                    <tr key={product.id}>
                                        <td>{product.name}</td>
                                        <td>{product.productCode}</td>
                                        <td>{product.productType}</td>
                                        <td>{product.primaryBrand}</td>
                                        <td>{product.salesLine}</td>
                                        <td>{product.mirrorLine}</td>
                                        <td>{product.linkLabel}</td>
                                        <td>
                                            <span class={product.activeClass}>{product.activeLabel}</span>
                                        </td>
                                        <td class="actions actions-row">
                                            <lightning-button
                                                label="Remove"
                                                variant="destructive-text"
                                                data-id={product.id}
                                                data-name={product.name}
                                                onclick={handleRemoveProductFromLine}
                                            ></lightning-button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:false={hasFilteredLineProducts}>
                        <div class="empty-state">
                            <p>No products linked to this line yet.</p>
                        </div>
                    </template>

                    <div class="assign-product-block">
                        <h4 class="modal-subtitle">Add product to line</h4>
                        <div class="form-grid">
                            <lightning-input
                                type="search"
                                label="Search catalog"
                                value={assignProductSearchTerm}
                                onchange={handleAssignProductSearch}
                            ></lightning-input>
                            <lightning-button
                                class="search-assign-btn"
                                label="Search"
                                onclick={handleSearchAssignableProducts}
                                disabled={isSearchingAssignable}
                            ></lightning-button>
                        </div>
                        <div class="form-grid">
                            <lightning-combobox
                                label="Product"
                                value={assignProductId}
                                options={assignProductOptions}
                                placeholder="Select a product"
                                onchange={handleAssignProductSelect}
                            ></lightning-combobox>
                            <lightning-combobox
                                label="Assign as"
                                value={assignMode}
                                options={assignModeOptions}
                                onchange={handleAssignModeChange}
                            ></lightning-combobox>
                        </div>
                        <div class="modal-actions left-actions">
                            <lightning-button
                                label="Assign to Line"
                                variant="brand"
                                disabled={isAssignProductDisabled}
                                onclick={handleAssignProductToLine}
                            ></lightning-button>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <lightning-button label="Close" onclick={handleCloseManageProductsModal}></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={showUserModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Create pharma user">
                <div class="modal-backdrop" onclick={handleCloseUserModal}></div>
                <div class="modal-panel">
                    <h3 class="modal-title">Create Pharma User</h3>
                    <p class="modal-help">
                        Creates a demo user with username pattern team.role@pharma.demo and assigns the matching Pharma persona.
                    </p>
                    <div class="form-grid">
                        <lightning-input
                            label="First Name"
                            value={draftUser.firstName}
                            data-field="firstName"
                            onchange={handleUserFieldChange}
                            required
                        ></lightning-input>
                        <lightning-input
                            label="Last Name"
                            value={draftUser.lastName}
                            data-field="lastName"
                            onchange={handleUserFieldChange}
                            required
                        ></lightning-input>
                    </div>
                    <lightning-input
                        label="Team Code"
                        value={draftUser.teamCode}
                        data-field="teamCode"
                        onchange={handleUserFieldChange}
                        placeholder="e.g. cardio"
                        required
                    ></lightning-input>
                    <lightning-combobox
                        label="Role"
                        value={draftUser.roleKey}
                        options={roleOptions}
                        data-field="roleKey"
                        onchange={handleUserFieldChange}
                    ></lightning-combobox>
                    <lightning-combobox
                        label="Assign to Territory (optional)"
                        value={draftUser.territoryId}
                        options={userTerritoryOptions}
                        data-field="territoryId"
                        onchange={handleUserFieldChange}
                    ></lightning-combobox>
                    <div class="modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseUserModal}></lightning-button>
                        <lightning-button
                            label="Create User"
                            variant="brand"
                            disabled={isUserSaveDisabled}
                            onclick={handleSaveUser}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={showEditProfileModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Edit user profile">
                <div class="modal-backdrop" onclick={handleCloseEditProfileModal}></div>
                <div class="modal-panel">
                    <h3 class="modal-title">Edit User Profile</h3>
                    <div class="form-grid">
                        <lightning-input
                            label="First Name"
                            value={draftProfile.firstName}
                            data-field="firstName"
                            onchange={handleProfileFieldChange}
                        ></lightning-input>
                        <lightning-input
                            label="Last Name"
                            value={draftProfile.lastName}
                            data-field="lastName"
                            onchange={handleProfileFieldChange}
                            required
                        ></lightning-input>
                    </div>
                    <lightning-input
                        label="Email"
                        type="email"
                        value={draftProfile.email}
                        data-field="email"
                        onchange={handleProfileFieldChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Username"
                        value={draftProfile.username}
                        data-field="username"
                        onchange={handleProfileFieldChange}
                        required
                    ></lightning-input>
                    <div class="form-grid">
                        <lightning-input
                            label="Title"
                            value={draftProfile.title}
                            data-field="title"
                            onchange={handleProfileFieldChange}
                        ></lightning-input>
                        <lightning-input
                            label="Department / Business Unit"
                            value={draftProfile.department}
                            data-field="department"
                            onchange={handleProfileFieldChange}
                        ></lightning-input>
                    </div>
                    <div class="modal-actions">
                        <lightning-button label="Cancel" onclick={handleCloseEditProfileModal}></lightning-button>
                        <lightning-button
                            label="Save Profile"
                            variant="brand"
                            disabled={isProfileSaveDisabled}
                            onclick={handleSaveProfile}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={showPasswordModal}>
            <section class="modal-shell" role="dialog" aria-modal="true" aria-label="Set one-time password">
                <div class="modal-backdrop" onclick={handleClosePasswordModal}></div>
                <div class="modal-panel">
                    <h3 class="modal-title">{passwordModalTitle}</h3>
                    <p class="modal-help">
                        Uses System.setPassword for a temporary one-time password. Leave blank to auto-generate.
                        Share the password securely after it is set — it is shown only here.
                    </p>
                    <div class="form-grid">
                        <lightning-input
                            label="One-time password"
                            type="text"
                            value={draftPassword.password}
                            data-field="password"
                            onchange={handlePasswordFieldChange}
                        ></lightning-input>
                        <lightning-input
                            label="Confirm password"
                            type="text"
                            value={draftPassword.confirmPassword}
                            data-field="confirmPassword"
                            onchange={handlePasswordFieldChange}
                        ></lightning-input>
                    </div>
                    <div class="modal-actions left-actions">
                        <lightning-button label="Generate OTP" onclick={handleGeneratePassword}></lightning-button>
                    </div>
                    <template if:true={generatedPassword}>
                        <div class="otp-result">
                            <p class="otp-label">Password to share</p>
                            <code class="otp-value">{generatedPassword}</code>
                        </div>
                    </template>
                    <div class="modal-actions">
                        <lightning-button label="Close" onclick={handleClosePasswordModal}></lightning-button>
                        <lightning-button
                            label="Set Password"
                            variant="brand"
                            disabled={isPasswordSaveDisabled}
                            onclick={handleSavePasswords}
                        ></lightning-button>
                    </div>
                </div>
            </section>
        </template>
    </section>
</template>
