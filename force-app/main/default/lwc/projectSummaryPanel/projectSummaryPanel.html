<template>
    <template if:true={hasSummary}>
        <section class="proj-summary">
            <header class="proj-summary-hero">
                <div>
                    <h3 class="proj-summary-title">Executive KPI Dashboard</h3>
                    <p class="proj-summary-lead">
                        Open tasks: {summary.openTaskCount} · Team members: {summary.teamSize}
                    </p>
                </div>
                <lightning-button label="Link Visits" onclick={handleOpenLinkVisits}></lightning-button>
            </header>

            <div class="proj-summary-grid">
                <div class="proj-summary-metric proj-summary-metric--budget">
                    <span class="proj-summary-metric-label">Budget</span>
                    <span class="proj-summary-metric-value">{summary.budgetDisplay}</span>
                    <div class="proj-summary-bar">
                        <div class="proj-summary-bar-fill proj-summary-bar-fill--budget" style={summary.budgetBarStyle}></div>
                    </div>
                    <span class="proj-summary-metric-caption">{summary.budgetPercent}% utilized</span>
                </div>
                <div class="proj-summary-metric">
                    <span class="proj-summary-metric-label">Meetings</span>
                    <span class="proj-summary-metric-value">{summary.meetingsDisplay}</span>
                    <div class="proj-summary-bar">
                        <div class="proj-summary-bar-fill proj-summary-bar-fill--blue" style={summary.meetingsBarStyle}></div>
                    </div>
                </div>
                <div class="proj-summary-metric">
                    <span class="proj-summary-metric-label">Round Tables</span>
                    <span class="proj-summary-metric-value">{summary.roundTablesDisplay}</span>
                    <div class="proj-summary-bar">
                        <div class="proj-summary-bar-fill proj-summary-bar-fill--purple" style={summary.roundTablesBarStyle}></div>
                    </div>
                </div>
                <div class="proj-summary-metric">
                    <span class="proj-summary-metric-label">Visits</span>
                    <span class="proj-summary-metric-value">{summary.visitsDisplay}</span>
                    <div class="proj-summary-bar">
                        <div class="proj-summary-bar-fill proj-summary-bar-fill--teal" style={summary.visitsBarStyle}></div>
                    </div>
                </div>
            </div>

            <h4 class="proj-summary-section-title">Project KPIs</h4>
            <template if:true={hasKpis}>
                <div class="proj-kpi-grid">
                    <template for:each={summary.kpis} for:item="kpi">
                        <article key={kpi.id} class={kpi.cardClass}>
                            <div class="proj-kpi-card-top">
                                <h5 class="proj-kpi-card-name">{kpi.kpiName}</h5>
                                <span class="proj-kpi-card-attainment">{kpi.attainmentDisplay}</span>
                            </div>
                            <p class="proj-kpi-card-metrics">{kpi.metricsDisplay} {kpi.unit}</p>
                            <div class="proj-summary-bar">
                                <div class="proj-summary-bar-fill" style={kpi.barStyle}></div>
                            </div>
                        </article>
                    </template>
                </div>
            </template>
            <template if:false={hasKpis}>
                <p class="proj-summary-empty">
                    No KPIs yet — add via Project KPIs related list.
                </p>
            </template>

            <h4 class="proj-summary-section-title">Open Work</h4>
            <template if:true={hasWorkItems}>
                <div class="proj-work-list">
                    <template for:each={summary.workItems} for:item="item">
                        <div key={item.id} class="proj-work-item">
                            <span class="proj-work-type">{item.itemType}</span>
                            <span class="proj-work-title">{item.title}</span>
                            <span class="proj-work-due">{item.dueDateDisplay}</span>
                            <span class="proj-work-status">{item.status}</span>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasWorkItems}>
                <p class="proj-summary-empty">
                    No open tasks or activities — use New Task or add Project Activities.
                </p>
            </template>
        </section>
    </template>
    <template if:true={error}>
        <p class="slds-text-color_error slds-p-around_small">{error}</p>
    </template>

    <template if:true={showLinkVisits}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Link Visits to Project</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoadingVisits}>
                        <div class="proj-link-visits-loading">
                            <lightning-spinner alternative-text="Loading eligible visits" size="small"></lightning-spinner>
                            <p>Loading eligible visits…</p>
                        </div>
                    </template>
                    <template if:true={visitsLoadError}>
                        <p class="proj-link-visits-error">{visitsLoadError}</p>
                    </template>
                    <template if:true={showVisitsEmptyState}>
                        <p class="proj-link-visits-empty">
                            No eligible visits in this project's date range. Visits must be unlinked and fall between the project start and end dates.
                        </p>
                    </template>
                    <template if:true={hasEligibleVisits}>
                        <lightning-dual-listbox
                            label="Eligible visits in project date range"
                            source-label="Available"
                            selected-label="Selected"
                            options={visitOptions}
                            value={selectedVisitIds}
                            onchange={handleVisitSelection}
                            disabled={isLoadingVisits}
                        ></lightning-dual-listbox>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseLinkVisits}></lightning-button>
                    <lightning-button
                        label="Link Selected"
                        variant="brand"
                        disabled={linkDisabled}
                        onclick={handleLinkVisits}
                        class="slds-m-left_x-small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
