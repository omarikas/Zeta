<template>
    <div class="template-header slds-page-header slds-page-header_record-home">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:education" size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p class="slds-page-header__name-meta">Coaching Template</p>
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <h1 class="template-title">{displayTitle}</h1>
                            </div>
                        </div>
                        <p class="slds-text-body_small slds-m-top_xx-small template-meta">
                            <span class={statusClass}>{statusLabel}</span>
                            <template if:true={templateType}>
                                <span class="meta-separator">•</span>
                                <span>{templateType}</span>
                            </template>
                            <template if:true={templateId}>
                                <span class="meta-separator">•</span>
                                <span class="template-id">{templateId}</span>
                            </template>
                        </p>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls">
                    <lightning-button
                        label="Clone"
                        variant="brand"
                        onclick={handleClone}
                        disabled={isCloning}
                    ></lightning-button>
                </div>
            </div>
        </div>
    </div>
</template>
