<template>
    <section class="rating-form-renderer">
        <template if:true={hasFields}>
            <template for:each={renderSections} for:item="section">
                <div key={section.key} class="rating-section">
                    <template if:true={resolvedShowSectionHeaders}>
                        <h4 class="rating-section-title">{section.label}</h4>
                    </template>
                    <div class="ratings-grid">
                        <template for:each={section.fields} for:item="field">
                            <article key={field.key} class={field.cardClass}>
                                <p class="rating-label">{field.label}</p>

                                <template if:true={field.isToggle}>
                                    <label class="toggle-wrap">
                                        <input
                                            type="checkbox"
                                            class="toggle-input"
                                            checked={field.rawValue}
                                            data-field={field.fieldApiName}
                                            disabled={field.isReadOnly}
                                            onchange={handleToggle}
                                        />
                                        <span class="toggle-track"></span>
                                        <span class="toggle-text">{field.rawValue}</span>
                                    </label>
                                </template>

                                <template if:true={field.isNumberDonut}>
                                    <div class="donut-wrap">
                                        <div
                                            class="donut-ring"
                                            style={field.donutStyle}
                                        ></div>
                                        <span class="donut-value" style={field.donutValueStyle}>{field.displayValue}</span>
                                    </div>
                                    <template if:false={field.isReadOnly}>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label={field.label}
                                            value={field.rawValue}
                                            data-field={field.fieldApiName}
                                            oninput={handleNumberInput}
                                            onchange={handleInputChange}
                                        ></lightning-input>
                                    </template>
                                </template>

                                <template if:true={field.isDotScale}>
                                    <div class="dot-scale" role="group" aria-label={field.label}>
                                        <template for:each={field.options} for:item="opt">
                                            <button
                                                key={opt.value}
                                                type="button"
                                                class={opt.dotClass}
                                                style={opt.dotStyle}
                                                title={opt.label}
                                                data-field={field.fieldApiName}
                                                data-value={opt.value}
                                                disabled={field.isReadOnly}
                                                onclick={handleDotSelect}
                                            ></button>
                                        </template>
                                    </div>
                                    <p class="dot-selected">{field.displayValue}</p>
                                </template>

                                <template if:true={field.isDateRelative}>
                                    <span class="date-chip">{field.displayValue}</span>
                                </template>

                                <template if:true={field.isPicklist}>
                                    <template if:true={field.isReadOnly}>
                                        <p class={field.valueClass}>{field.displayValue}</p>
                                    </template>
                                    <template if:false={field.isReadOnly}>
                                        <lightning-combobox
                                            variant="label-hidden"
                                            label={field.label}
                                            value={field.rawValue}
                                            options={field.picklistOptions}
                                            placeholder="Select KOL reason"
                                            data-field={field.fieldApiName}
                                            onchange={handleInputChange}
                                        ></lightning-combobox>
                                    </template>
                                </template>

                                <template if:true={field.isTextValue}>
                                    <p class={field.valueClass}>{field.displayValue}</p>
                                    <template if:false={field.isReadOnly}>
                                        <lightning-input
                                            variant="label-hidden"
                                            label={field.label}
                                            value={field.rawValue}
                                            data-field={field.fieldApiName}
                                            onchange={handleInputChange}
                                        ></lightning-input>
                                    </template>
                                </template>

                                <template if:true={field.isCalculated}>
                                    <span class="calculated-badge">{field.displayValue}</span>
                                </template>
                            </article>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={showSaveButton}>
                <footer class="ratings-actions">
                    <lightning-button
                        label="Save Ratings"
                        variant="brand"
                        onclick={handleSave}
                        disabled={isSaving}
                    ></lightning-button>
                </footer>
            </template>
        </template>

        <template if:false={hasFields}>
            <p class="empty">No rating fields configured.</p>
        </template>
    </section>
</template>
