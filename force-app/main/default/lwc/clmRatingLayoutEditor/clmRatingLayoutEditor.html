<template>
    <section class="rating-layout-editor">
        <header class="editor-header">
            <div class="editor-header-text">
                <h2>Rating Layouts</h2>
                <p>Design account, territory, and product rating forms with a live rep preview.</p>
            </div>
            <lightning-button label="New Layout" variant="brand" onclick={handleNew}></lightning-button>
        </header>

        <div class="editor-grid">
            <aside class="layout-list">
                <h3 class="layout-list-title">Layouts</h3>
                <template if:true={layouts.length}>
                    <template for:each={layouts} for:item="layout">
                        <button
                            key={layout.id}
                            class={layout.itemClass}
                            data-id={layout.id}
                            onclick={handleSelect}
                        >
                            <span class="layout-name">{layout.name}</span>
                            <span class={layout.statusClass}>{layout.status}</span>
                            <span class="layout-counts">
                                <template for:each={layout.countChips} for:item="chip">
                                    <span key={chip.key} class="count-chip">{chip.label}</span>
                                </template>
                            </span>
                        </button>
                    </template>
                </template>
                <template if:false={layouts.length}>
                    <p class="layout-empty">No layouts yet. Create one to get started.</p>
                </template>
            </aside>

            <template if:true={hasSelectedLayout}>
                <div class="editor-main">
                    <div class="layout-meta">
                        <lightning-input
                            label="Layout Name"
                            value={selectedLayout.name}
                            onchange={handleNameChange}
                        ></lightning-input>
                        <template if:true={isDeployed}>
                            <span class="deployed-badge">Deployed — active for field reps</span>
                        </template>
                    </div>

                    <div class="editor-split">
                        <section class="picker-pane">
                            <nav class="section-tabs" aria-label="Rating sections">
                                <template for:each={sectionTabs} for:item="tab">
                                    <button
                                        key={tab.key}
                                        class={tab.className}
                                        data-section={tab.key}
                                        onclick={handleSectionTab}
                                    >
                                        {tab.label}
                                    </button>
                                </template>
                            </nav>

                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                label="Quick Find"
                                placeholder="Quick find fields..."
                                value={searchTerm}
                                onchange={handleSearch}
                            ></lightning-input>

                            <div class="catalog-list">
                                <template for:each={catalogFields} for:item="field">
                                    <label key={field.identity} class="catalog-item">
                                        <input
                                            type="checkbox"
                                            checked={field.checked}
                                            data-identity={field.identity}
                                            onchange={handleCatalogToggle}
                                        />
                                        <span class="catalog-label">{field.label}</span>
                                        <span class="catalog-meta">{field.widget}</span>
                                    </label>
                                </template>
                            </div>

                            <template if:true={selectedSectionFields.length}>
                                <div class="selected-fields">
                                    <h4>Selected Fields</h4>
                                    <template for:each={selectedSectionFields} for:item="field">
                                        <div key={field.identity} class="selected-field-row">
                                            <span>{field.label}</span>
                                            <div class="selected-field-actions">
                                                <button
                                                    type="button"
                                                    class="order-btn"
                                                    data-identity={field.identity}
                                                    data-direction="up"
                                                    onclick={handleMoveField}
                                                    disabled={field.canMoveUp}
                                                >
                                                    ↑
                                                </button>
                                                <button
                                                    type="button"
                                                    class="order-btn"
                                                    data-identity={field.identity}
                                                    data-direction="down"
                                                    onclick={handleMoveField}
                                                    disabled={field.canMoveDown}
                                                >
                                                    ↓
                                                </button>
                                                <button
                                                    type="button"
                                                    class="remove-btn"
                                                    data-identity={field.identity}
                                                    onclick={handleRemoveField}
                                                >
                                                    ×
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </section>

                        <section class="preview-pane">
                            <header class="preview-header">
                                <h3>Live Preview</h3>
                                <p>What field reps will see after a presentation</p>
                            </header>
                            <c-rating-form-renderer
                                layout-json={layoutJson}
                                values-json={previewValuesJson}
                                show-section-headers
                                onvaluechange={handlePreviewValueChange}
                            ></c-rating-form-renderer>
                        </section>
                    </div>

                    <footer class="editor-actions">
                        <lightning-button label="Save Draft" onclick={handleSave}></lightning-button>
                        <lightning-button label="Deploy" variant="brand" onclick={handleDeploy}></lightning-button>
                    </footer>
                </div>
            </template>

            <template if:false={hasSelectedLayout}>
                <article class="layout-placeholder">
                    <lightning-icon icon-name="utility:rating" size="large"></lightning-icon>
                    <h3>Select or create a layout</h3>
                    <p>Choose a layout from the list, or click <strong>New Layout</strong> to begin.</p>
                </article>
            </template>
        </div>
    </section>
</template>
