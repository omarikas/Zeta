<template>
    <article class="slds-card">
        <header class="slds-card__header"><h2 class="slds-card__header-title">Cross-Department Collaboration</h2></header>
        <div class="slds-card__body slds-card__body_inner">
            <template if:true={error}><p class="slds-text-color_error">{error}</p></template>
            <h3 class="slds-text-heading_small">Open / In Progress</h3>
            <template for:each={openRequests} for:item="req">
                <div key={req.id} class="slds-box slds-m-bottom_x-small">
                    <strong>{req.subject}</strong> — {req.requestingDept} → {req.targetDept} · {req.priority}
                </div>
            </template>
            <h3 class="slds-text-heading_small slds-m-top_medium">Resolved / Closed</h3>
            <template for:each={resolvedRequests} for:item="req">
                <div key={req.id} class="slds-box slds-m-bottom_x-small">{req.subject} — {req.status}</div>
            </template>
        </div>
    </article>
</template>
