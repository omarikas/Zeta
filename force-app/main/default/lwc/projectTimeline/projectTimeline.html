<template>
    <section class="proj-panel">
        <header class="proj-panel-header">
            <div class="proj-panel-header-icon" aria-hidden="true">
                <lightning-icon icon-name="utility:date_input" size="x-small"></lightning-icon>
            </div>
            <div class="proj-panel-header-copy">
                <h2 class="proj-panel-title">Project Timeline</h2>
                <p class="proj-panel-subtitle">Milestones, KPIs, and delivery activities</p>
            </div>
            <div class="proj-panel-header-actions">
                <lightning-button
                    label="Add milestone"
                    icon-name="utility:add"
                    variant="brand-outline"
                    onclick={handleOpenAddMilestone}
                ></lightning-button>
            </div>
        </header>

        <template if:true={isLoading}>
            <div class="proj-panel-loading">
                <lightning-spinner alternative-text="Loading timeline" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="proj-panel-alert">{error}</div>
        </template>

        <template if:true={hasTimeline}>
            <div class="proj-timeline-range">
                <div class="proj-timeline-range-labels">
                    <span>{timeline.startDateDisplay}</span>
                    <span>{timeline.endDateDisplay}</span>
                </div>
                <div class="proj-timeline-range-track">
                    <div class="proj-timeline-range-fill" style={timeline.progressStyle}></div>
                    <div class="proj-timeline-range-today" style={timeline.todayMarkerStyle} title="Today"></div>
                    <template for:each={timeline.events} for:item="event">
                        <div
                            key={event.id}
                            class={event.markerClass}
                            style={event.markerStyle}
                            title={event.title}
                        ></div>
                    </template>
                </div>
                <p class="proj-timeline-range-caption">{timeline.progressPercent}% elapsed</p>
            </div>

            <template if:true={hasMilestones}>
                <div class="proj-timeline-section">
                    <h3 class="proj-timeline-section-title">Milestones</h3>
                    <ol class="proj-timeline-list">
                        <template for:each={milestoneEvents} for:item="event">
                            <li key={event.id} class={event.listItemClass}>
                                <button
                                    type="button"
                                    class="proj-timeline-milestone-button"
                                    data-id={event.id}
                                    onclick={handleMilestoneClick}
                                >
                                    <div class="proj-timeline-list-marker" aria-hidden="true"></div>
                                    <div class="proj-timeline-list-body">
                                        <div class="proj-timeline-list-top">
                                            <span class="proj-timeline-list-type">{event.typeLabel}</span>
                                            <span class="proj-timeline-list-date">{event.dateDisplay}</span>
                                        </div>
                                        <h4 class="proj-timeline-list-title">{event.title}</h4>
                                        <p class="proj-timeline-list-subtitle">{event.subtitle}</p>
                                        <template if:true={event.status}>
                                            <span class="proj-timeline-list-status">{event.status}</span>
                                        </template>
                                    </div>
                                </button>
                            </li>
                        </template>
                    </ol>
                </div>
            </template>

            <template if:false={hasMilestones}>
                <div class="proj-panel-empty proj-panel-empty--milestones">
                    <p>{emptyMessage}</p>
                    <lightning-button
                        label="Add your first milestone"
                        icon-name="utility:add"
                        variant="brand"
                        onclick={handleOpenAddMilestone}
                    ></lightning-button>
                </div>
            </template>

            <template if:true={hasEvents}>
                <div class="proj-timeline-section">
                    <h3 class="proj-timeline-section-title">All Timeline Events</h3>
                    <ol class="proj-timeline-list">
                        <template for:each={timeline.events} for:item="event">
                            <li key={event.id} class={event.itemClass}>
                                <div class="proj-timeline-list-marker" aria-hidden="true"></div>
                                <div class="proj-timeline-list-body">
                                    <div class="proj-timeline-list-top">
                                        <span class="proj-timeline-list-type">{event.typeLabel}</span>
                                        <span class="proj-timeline-list-date">{event.dateDisplay}</span>
                                    </div>
                                    <h4 class="proj-timeline-list-title">{event.title}</h4>
                                    <p class="proj-timeline-list-subtitle">{event.subtitle}</p>
                                    <template if:true={event.status}>
                                        <span class="proj-timeline-list-status">{event.status}</span>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ol>
                </div>
            </template>
        </template>

        <template if:true={showMilestoneModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open proj-milestone-modal">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={isViewMode}>
                            <dl class="proj-milestone-details">
                                <dt>Target date</dt>
                                <dd>{selectedMilestone.dateDisplay}</dd>
                                <dt>Status</dt>
                                <dd>{selectedMilestone.status}</dd>
                                <dt>Description</dt>
                                <dd>{selectedMilestone.subtitle}</dd>
                            </dl>
                        </template>
                        <template if:false={isViewMode}>
                            <lightning-input
                                label="Milestone name"
                                value={milestoneName}
                                required
                                onchange={handleNameChange}
                            ></lightning-input>
                            <lightning-input
                                type="date"
                                label="Target date"
                                value={milestoneDate}
                                onchange={handleDateChange}
                            ></lightning-input>
                            <lightning-textarea
                                label="Description"
                                value={milestoneDescription}
                                onchange={handleDescriptionChange}
                            ></lightning-textarea>
                            <lightning-combobox
                                label="Status"
                                value={milestoneStatus}
                                options={statusOptions}
                                onchange={handleStatusChange}
                            ></lightning-combobox>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" onclick={handleCloseModal}></lightning-button>
                        <template if:false={isViewMode}>
                            <lightning-button
                                label="Save milestone"
                                variant="brand"
                                disabled={isSaveDisabled}
                                onclick={handleSaveMilestone}
                            ></lightning-button>
                        </template>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </section>
</template>
