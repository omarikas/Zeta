<template>
    <section class="agent-strip">
        <button type="button" class="agent-strip-main" onclick={handleOpenModal}>
            <lightning-icon icon-name="utility:einstein" size="x-small" class="agent-icon"></lightning-icon>
            <span class="agent-strip-copy">
                <span class="agent-strip-title">Agentforce Insights</span>
                <span class="agent-strip-teaser">{teaserText}</span>
            </span>
            <template if:true={recommendationCount}>
                <span class="agent-strip-badge">{recommendationCount}</span>
            </template>
        </button>
        <lightning-button
            label="Open"
            variant="brand"
            onclick={handleOpenModal}
            class="agent-open-btn"
        ></lightning-button>
        <lightning-button-icon
            icon-name="utility:refresh"
            alternative-text="Refresh insights"
            onclick={handleRefreshClick}
        ></lightning-button-icon>
    </section>

    <template if:true={isModalOpen}>
        <div class="agent-modal-wrapper">
            <div class="agent-backdrop" role="presentation" onclick={handleCloseModal}></div>
            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open slds-modal_large agent-modal"
                aria-labelledby="agent-modal-heading"
                aria-modal="true"
            >
                <div class="slds-modal__container agent-modal-container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={handleCloseModal}
                        >
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="agent-modal-heading" class="slds-modal__title slds-hyphenate">Agentforce Insights</h2>
                        <p class="agent-modal-subtitle">Prioritized plan-cycle actions from sell-out and territory data</p>
                    </header>

                    <div class="slds-modal__content agent-modal-content">
                        <template if:true={isLoading}>
                            <div class="agent-loading">
                                <lightning-spinner alternative-text="Generating Agentforce insights" size="medium"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={isLoading}>
                            <template if:true={hasInsights}>
                                <section class="rec-section rec-section--featured">
                                    <div class="rec-section-head">
                                        <h3 class="section-title">Prioritized recommendations</h3>
                                        <span class="rec-section-hint">Highest impact first — select to apply</span>
                                    </div>
                                    <div class="rec-grid">
                                        <template for:each={prioritizedRecommendations} for:item="rec">
                                            <article key={rec.key} class={rec.cardClass}>
                                                <div class="rec-priority">
                                                    <span class={rec.priorityClass}>{rec.priorityLabel}</span>
                                                    <span class="rec-type">{rec.typeLabel}</span>
                                                </div>
                                                <div class="rec-head">
                                                    <lightning-input
                                                        type="checkbox"
                                                        label={rec.title}
                                                        checked={rec.isSelected}
                                                        data-id={rec.recordId}
                                                        onchange={handleRecommendationToggle}
                                                    ></lightning-input>
                                                </div>
                                                <p class="rec-copy">{rec.description}</p>
                                                <template if:true={rec.targetUserName}>
                                                    <p class="rec-meta">Rep: {rec.targetUserName}</p>
                                                </template>
                                            </article>
                                        </template>
                                    </div>
                                    <template if:false={hasRecommendations}>
                                        <p class="empty-hint">No recommendations for the current filters.</p>
                                    </template>
                                </section>

                                <nav class="detail-tabs" aria-label="Insight detail pages">
                                    <template for:each={detailTabs} for:item="tab">
                                        <button
                                            key={tab.id}
                                            type="button"
                                            class={tab.buttonClass}
                                            data-page={tab.id}
                                            onclick={handleDetailTab}
                                        >
                                            {tab.label}
                                        </button>
                                    </template>
                                </nav>

                                <div class="detail-panel">
                                    <template if:true={isSummaryPage}>
                                        <p class="agent-headline">{insights.headline}</p>
                                        <p class="agent-summary">{insights.marketSummary}</p>
                                        <p class="agent-summary">{insights.brandSummary}</p>
                                        <p class="agent-summary">{insights.planSummary}</p>
                                    </template>

                                    <template if:true={isMarketPage}>
                                        <div class="detail-panel-head">
                                            <h4 class="section-title">Market trends</h4>
                                            <span class="page-indicator">{marketPageIndicator}</span>
                                        </div>
                                        <div class="trend-list">
                                            <template for:each={paginatedMarketTrends} for:item="trend">
                                                <article key={trend.key} class="trend-card">
                                                    <div class="trend-card-head">
                                                        <span class="trend-title">{trend.title}</span>
                                                        <span class={trend.directionClass}>{trend.metric}</span>
                                                    </div>
                                                    <p class="trend-copy">{trend.narrative}</p>
                                                </article>
                                            </template>
                                        </div>
                                        <div class="detail-pager">
                                            <lightning-button
                                                label="Previous"
                                                onclick={handleMarketPrev}
                                                disabled={marketPrevDisabled}
                                            ></lightning-button>
                                            <lightning-button
                                                label="Next"
                                                onclick={handleMarketNext}
                                                disabled={marketNextDisabled}
                                            ></lightning-button>
                                        </div>
                                    </template>

                                    <template if:true={isBrandPage}>
                                        <div class="detail-panel-head">
                                            <h4 class="section-title">Brand trends</h4>
                                            <span class="page-indicator">{brandPageIndicator}</span>
                                        </div>
                                        <div class="trend-list">
                                            <template for:each={paginatedBrandTrends} for:item="trend">
                                                <article key={trend.key} class="trend-card">
                                                    <div class="trend-card-head">
                                                        <span class="trend-title">{trend.title}</span>
                                                        <span class={trend.directionClass}>{trend.metric}</span>
                                                    </div>
                                                    <p class="trend-copy">{trend.narrative}</p>
                                                </article>
                                            </template>
                                        </div>
                                        <div class="detail-pager">
                                            <lightning-button
                                                label="Previous"
                                                onclick={handleBrandPrev}
                                                disabled={brandPrevDisabled}
                                            ></lightning-button>
                                            <lightning-button
                                                label="Next"
                                                onclick={handleBrandNext}
                                                disabled={brandNextDisabled}
                                            ></lightning-button>
                                        </div>
                                    </template>

                                    <template if:true={isVisionPage}>
                                        <div class="agent-scope">
                                            <lightning-dual-listbox
                                                label="Reps in scope"
                                                source-label="Available"
                                                selected-label="Selected"
                                                options={repOptions}
                                                value={selectedRepIds}
                                                onchange={handleRepChange}
                                                size="4"
                                            ></lightning-dual-listbox>
                                        </div>
                                        <div class="vision-fields">
                                            <lightning-textarea
                                                label="Vision summary"
                                                value={vision.visionSummary}
                                                onchange={handleVisionSummaryChange}
                                            ></lightning-textarea>
                                            <lightning-input
                                                label="Focus therapy areas"
                                                value={vision.focusTherapyAreas}
                                                onchange={handleFocusTherapyChange}
                                            ></lightning-input>
                                            <lightning-input
                                                label="Focus product families"
                                                value={vision.focusProductFamilies}
                                                onchange={handleFocusFamiliesChange}
                                            ></lightning-input>
                                            <lightning-input
                                                label="Classification visit weights (JSON)"
                                                value={vision.classificationVisitWeights}
                                                onchange={handleWeightsChange}
                                            ></lightning-input>
                                            <lightning-button
                                                label="Save vision"
                                                variant="neutral"
                                                onclick={handleSaveVision}
                                            ></lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </template>
                    </div>

                    <footer class="slds-modal__footer agent-modal-footer">
                        <lightning-button label="Close" onclick={handleCloseModal}></lightning-button>
                        <lightning-button
                            label={applyLabel}
                            variant="brand"
                            onclick={handleApply}
                            disabled={applyDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
        </div>
    </template>
</template>
