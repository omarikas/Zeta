<template>
    <div class="oce-list">
        <div class="oce-list-toolbar">
            <div class="oce-list-toolbar-row">
                <span class="oce-list-title">Accounts</span>
                <button
                    type="button"
                    class="oce-sort-btn"
                    onclick={handleSortToggle}
                    title={sortDirectionLabel}
                >Sort by: Name {sortDirectionIcon}</button>
            </div>
        </div>

        <template if:true={isLoading}>
            <p class="oce-list-loading">Loading accounts…</p>
        </template>

        <template if:false={isLoading}>
            <div class="oce-table-scroll" role="region" aria-label="Accounts list">
                <table class="oce-table">
                    <thead>
                        <tr>
                            <th scope="col" class="col-account">Account</th>
                            <th scope="col" class="col-class">Class</th>
                            <th scope="col" class="col-plan">Plan</th>
                            <th scope="col" class="col-visits">Visits</th>
                            <th scope="col" class="col-gap">Gap</th>
                            <th scope="col" class="col-pace">Pace</th>
                            <th scope="col" class="col-score">Score</th>
                            <th scope="col" class="col-risk">Risk</th>
                            <th scope="col" class="col-specialty">Specialty</th>
                            <th scope="col" class="col-actions"><span class="slds-assistive-text">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={displayRows} for:item="row">
                            <tr key={row.accountId} class="oce-row">
                                <td class="col-account">
                                    <div class="account-cell">
                                        <span class={row.riskDotClass} title={row.agentforceRisk}></span>
                                        <span class={row.typeIconClass} title={row.pinLabel} aria-hidden="true"></span>
                                        <div class="account-text">
                                            <a
                                                href="#"
                                                class="oce-account-link"
                                                data-id={row.accountId}
                                                onclick={handleAccountClick}
                                                title={row.accountName}
                                            >{row.accountName}</a>
                                            <p class="oce-meta-line" title={row.metaLine}>{row.metaLine}</p>
                                            <template if:true={row.hasBusinessUnits}>
                                                <div class="oce-bu-chips">
                                                    <template for:each={row.businessUnits} for:item="bu">
                                                        <span
                                                            key={bu.id}
                                                            class="oce-bu-chip"
                                                            title={bu.businessUnitExternalId}
                                                        >{bu.chipLabel}</span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </td>
                                <td class="col-class">
                                    <span class={row.classBadgeClass}>{row.classificationDisplay}</span>
                                </td>
                                <td class="col-plan">
                                    <span class={row.planBadgeClass}>{row.planCycleDisplay}</span>
                                </td>
                                <td class="col-visits">
                                    <div class="stack-cell">
                                        <span class="oce-field-strong">{row.callPlanLabel}</span>
                                        <span class="oce-field-subvalue">{row.plannedPlanLabel}</span>
                                    </div>
                                </td>
                                <td class="col-gap">
                                    <span class="oce-field-value">{row.gapDisplay}</span>
                                </td>
                                <td class="col-pace">
                                    <span class={row.paceClass}>{row.paceDisplay}</span>
                                </td>
                                <td class="col-score">
                                    <span class="oce-field-strong">{row.scoreDisplay}</span>
                                </td>
                                <td class="col-risk">
                                    <span class={row.riskBadgeClass}>{row.riskDisplay}</span>
                                </td>
                                <td class="col-specialty">
                                    <span class="oce-field-value specialty-text" title={row.specialtyDisplay}>{row.specialtyDisplay}</span>
                                </td>
                                <td class="col-actions">
                                    <div class="oce-row-actions">
                                        <button
                                            type="button"
                                            class="oce-action-btn"
                                            data-id={row.accountId}
                                            data-action="view"
                                            onclick={handleRowAction}
                                        >View</button>
                                        <button
                                            type="button"
                                            class="oce-action-btn"
                                            data-id={row.accountId}
                                            data-action="plan"
                                            onclick={handleRowAction}
                                        >Plan</button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</template>
