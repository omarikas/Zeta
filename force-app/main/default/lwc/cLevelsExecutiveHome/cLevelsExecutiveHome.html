<template>
    <article class="exec-home slds-card">
        <header class="exec-header">
            <h2 class="exec-title">Executive Overview</h2>
            <p class="exec-subtitle">BU-level rollup with charts and hierarchy drill-down</p>
        </header>

        <div class="exec-body">
            <template if:true={isLoading}>
                <div class="exec-loading">
                    <lightning-spinner alternative-text="Loading executive overview" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-bottom_small">{errorMessage}</div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasBuData}>
                    <section class="org-snapshot-section">
                        <div class="section-heading">
                            <h3 class="section-title">Organization Snapshot</h3>
                            <p class="section-hint">Headcount, field activity, and CLM ROI across all business units</p>
                        </div>
                        <div class="org-stat-grid">
                            <template for:each={orgStatTiles} for:item="tile">
                                <div key={tile.id} class="org-stat-cell">
                                    <template if:true={tile.isClickable}>
                                        <button
                                            type="button"
                                            class={tile.tileClass}
                                            data-tile-id={tile.id}
                                            onclick={handleOrgStatClick}
                                        >
                                            <lightning-icon icon-name={tile.icon} size="small"></lightning-icon>
                                            <div class="org-stat-body">
                                                <span class="org-stat-value">{tile.value}</span>
                                                <span class="org-stat-label">{tile.label}</span>
                                                <span class="org-stat-hint">{tile.hint}</span>
                                            </div>
                                        </button>
                                    </template>
                                    <template if:false={tile.isClickable}>
                                        <article class={tile.tileClass}>
                                            <lightning-icon icon-name={tile.icon} size="small"></lightning-icon>
                                            <div class="org-stat-body">
                                                <span class="org-stat-value">{tile.value}</span>
                                                <span class="org-stat-label">{tile.label}</span>
                                                <span class="org-stat-hint">{tile.hint}</span>
                                            </div>
                                        </article>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <template if:true={hasMonthlyVisitChart}>
                            <div class="monthly-visits-chart">
                                <h4 class="monthly-chart-title">Completed Visits — Last 6 Months</h4>
                                <p class="monthly-chart-caption">Completed field visits across all reps · last 6 calendar months</p>
                                <div class="monthly-chart-wrap">
                                    <div class="monthly-y-axis" aria-hidden="true">
                                        <span>{monthlyChartMeta.yMaxLabel}</span>
                                        <span>{monthlyChartMeta.yMidLabel}</span>
                                        <span>{monthlyChartMeta.yZeroLabel}</span>
                                    </div>
                                    <div class="monthly-plot">
                                        <template for:each={monthlyVisitChart} for:item="point">
                                            <div key={point.monthKey} class="monthly-bar-column">
                                                <span class="monthly-count">{point.countLabel}</span>
                                                <div class="monthly-bar-track">
                                                    <div class="monthly-bar" style={point.barStyle} title={point.tooltip}></div>
                                                </div>
                                                <span class="monthly-label">{point.monthLabel}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </section>

                    <template if:true={showWorkforcePanel}>
                        <section class="workforce-section">
                            <div class="section-heading workforce-heading">
                                <div>
                                    <h3 class="section-title">{workforcePanelTitle}</h3>
                                    <p class="section-hint">Click an employee to view attendance and compensation</p>
                                </div>
                                <button type="button" class="workforce-close" onclick={handleCloseWorkforcePanel}>Close</button>
                            </div>

                            <template if:true={isWorkforceLoading}>
                                <div class="exec-loading compact">
                                    <lightning-spinner alternative-text="Loading workforce roster" size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template if:false={isWorkforceLoading}>
                                <template if:true={hasTopPerformers}>
                                    <div class="top-performers-section">
                                        <div class="top-performers-heading">
                                            <h4 class="top-performers-title">Top Performers</h4>
                                            <p class="section-hint">Best in class for the selected scope — click to view details</p>
                                        </div>
                                        <div class="top-performers-grid">
                                            <template for:each={topPerformers} for:item="performer">
                                                <article
                                                    key={performer.key}
                                                    class={performer.cardClass}
                                                    data-employee-id={performer.employeeUserId}
                                                    onclick={handleTopPerformerClick}
                                                >
                                                    <div class="top-performer-icon-wrap">
                                                        <lightning-icon icon-name={performer.icon} size="x-small"></lightning-icon>
                                                    </div>
                                                    <div class="top-performer-avatar" aria-hidden="true">{performer.initials}</div>
                                                    <h5 class="top-performer-name">{performer.employeeName}</h5>
                                                    <p class="top-performer-metric">{performer.metricDisplay}</p>
                                                    <p class="top-performer-dimension">
                                                        Performing best in <strong>{performer.dimensionLabel}</strong>
                                                    </p>
                                                </article>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                                <template if:true={hasWorkforceRows}>
                                    <div class="workforce-table-wrap">
                                        <table class="workforce-table">
                                            <thead>
                                                <tr>
                                                    <th>Name</th>
                                                    <th>Role</th>
                                                    <th>Territory</th>
                                                    <th>Coverage</th>
                                                    <th>Call Rate</th>
                                                    <th>Salary</th>
                                                    <th>Bonus</th>
                                                    <th>Commission</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={decoratedWorkforceRows} for:item="row">
                                                    <tr
                                                        key={row.rowKey}
                                                        class={row.rowClass}
                                                        data-employee-id={row.employeeUserId}
                                                        onclick={handleWorkforceRowClick}
                                                    >
                                                        <td>{row.employeeName}</td>
                                                        <td>{row.roleLabel}</td>
                                                        <td>{row.territoryLabel}</td>
                                                        <td>{row.coverageDisplay}</td>
                                                        <td>{row.callRateDisplay}</td>
                                                        <td>{row.salaryDisplay}</td>
                                                        <td><span class={row.bonusClass}>{row.bonusLabel}</span></td>
                                                        <td><span class={row.commissionClass}>{row.commissionLabel}</span></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <template if:true={showWorkforceSalaryTotal}>
                                        <p class="workforce-payroll-total">
                                            Total monthly base payroll: {workforceSalaryTotalDisplay}
                                        </p>
                                    </template>
                                </template>
                                <template if:false={hasWorkforceRows}>
                                    <p class="section-hint">No employees found for the selected scope.</p>
                                </template>
                            </template>

                            <template if:true={isAttendanceLoading}>
                                <div class="exec-loading compact">
                                    <lightning-spinner alternative-text="Loading attendance detail" size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template if:true={hasAttendanceDetail}>
                                <section class="attendance-detail">
                                    <h4 class="attendance-title">{attendanceDetail.employeeName} — {attendanceDetail.monthLabel}</h4>
                                    <p class="section-hint">{attendanceDetail.roleLabel} · {attendanceDetail.territoryLabel}</p>

                                    <div class="attendance-summary-chips">
                                        <span class="attendance-chip">Days with activity: {attendanceDetail.summary.daysWithActivities}</span>
                                        <span class="attendance-chip">8h compliant: {attendanceDetail.summary.compliantDays}</span>
                                        <span class="attendance-chip">TOT days: {attendanceDetail.summary.totDays}</span>
                                        <span class="attendance-chip">Not reported: {attendanceDetail.summary.notReportedDays}</span>
                                        <span class="attendance-chip">Submitted calls: {attendanceDetail.summary.submittedCalls}</span>
                                    </div>

                                    <template if:true={attendanceCompensation}>
                                        <div class="compensation-card">
                                            <h5 class="compensation-title">Compensation</h5>
                                            <div class="compensation-grid">
                                                <div>
                                                    <span class="compensation-label">Base salary</span>
                                                    <span class="compensation-value">{attendanceCompensation.salaryDisplay}</span>
                                                </div>
                                                <div>
                                                    <span class="compensation-label">Bonus</span>
                                                    <span class={attendanceCompensation.bonusClass}>{attendanceCompensation.bonusLabel}</span>
                                                </div>
                                                <div>
                                                    <span class="compensation-label">Commission</span>
                                                    <span class={attendanceCompensation.commissionClass}>{attendanceCompensation.commissionLabel}</span>
                                                </div>
                                            </div>
                                            <ul class="criteria-list">
                                                <template for:each={attendanceCriteria} for:item="criterion">
                                                    <li key={criterion.key} class={criterion.statusClass}>
                                                        <lightning-icon icon-name={criterion.statusIcon} size="xx-small"></lightning-icon>
                                                        <span>{criterion.label}: {criterion.detail}</span>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>

                                    <div class="attendance-table-wrap">
                                        <table class="attendance-table">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Working</th>
                                                    <th>Check In</th>
                                                    <th>Check Out</th>
                                                    <th>Hours</th>
                                                    <th>Compliant</th>
                                                    <th>Calls</th>
                                                    <th>AM</th>
                                                    <th>PM</th>
                                                    <th>CLM</th>
                                                    <th>TOT</th>
                                                    <th>Time Off</th>
                                                    <th>No Activity</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={attendanceDayRows} for:item="day">
                                                    <tr key={day.key} class={day.rowClass}>
                                                        <td>{day.dayLabel}</td>
                                                        <td>{day.workingDayDisplay}</td>
                                                        <td>{day.checkInDisplay}</td>
                                                        <td>{day.checkOutDisplay}</td>
                                                        <td>{day.hoursWorkedDisplay}</td>
                                                        <td>
                                                            <span class={day.compliantClass}>{day.compliantDisplay}</span>
                                                        </td>
                                                        <td>{day.submittedCalls}</td>
                                                        <td>{day.amVisits}</td>
                                                        <td>{day.pmVisits}</td>
                                                        <td>{day.clmVisits}</td>
                                                        <td>{day.totDays}</td>
                                                        <td>{day.timeOffDays}</td>
                                                        <td>{day.noActivityDays}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            </template>
                        </section>
                    </template>

                    <section class="chart-section">
                        <div class="section-heading">
                            <h3 class="section-title">Business Unit Comparison</h3>
                            <p class="section-hint">Click a BU column or card to drill down</p>
                        </div>
                        <div class="chart-legend">
                            <template for:each={chartLegend} for:item="item">
                                <span key={item.id} class="legend-item">
                                    <span class={item.swatchClass}></span>
                                    {item.label}
                                </span>
                            </template>
                        </div>
                        <div class="comparison-chart">
                            <template for:each={buComparison} for:item="bu">
                                <button
                                    key={bu.id}
                                    type="button"
                                    class="chart-group"
                                    data-id={bu.id}
                                    onclick={handleChartGroupClick}
                                >
                                    <div class="chart-bars">
                                        <div class="chart-bar coverage" style={bu.coverageBarStyle} title={bu.coverage}></div>
                                        <div class="chart-bar call-rate" style={bu.callRateBarStyle} title={bu.callRate}></div>
                                        <div class="chart-bar kol" style={bu.kolBarStyle} title={bu.kolCoverage}></div>
                                    </div>
                                    <span class="chart-label">{bu.name}</span>
                                </button>
                            </template>
                        </div>
                    </section>

                    <section class="bu-cards-section">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <template for:each={buComparison} for:item="bu">
                                <div key={bu.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                                    <button type="button" class={bu.cardClass} data-id={bu.id} onclick={handleBuCardClick}>
                                        <h3 class="bu-name">{bu.name}</h3>
                                        <div class="bu-metrics">
                                            <span>Coverage {bu.coverage}</span>
                                            <span>Call Rate {bu.callRate}</span>
                                            <span>KOL {bu.kolCoverage}</span>
                                        </div>
                                        <div class="bu-meta">
                                            <span>{bu.workforceLabel}</span>
                                            <span>{bu.visitsLabel}</span>
                                            <span>CLM {bu.clmUsageLabel} adoption · {bu.clmLibraryLabel}</span>
                                            <span>Coaching Days {bu.coachingDays} · Reps Coached {bu.repsCoached}</span>
                                        </div>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </section>

                    <template if:true={showDrillPanel}>
                        <section class="drill-section">
                            <div class="section-heading drill-heading">
                                <div>
                                    <h3 class="section-title">{selectedBuName} Drill-Down</h3>
                                    <p class="section-hint">Filter by line and district, then expand rows to see reps</p>
                                </div>
                            </div>

                            <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium filter-row">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-combobox
                                        label="Line"
                                        value={selectedLine}
                                        options={lineOptions}
                                        onchange={handleLineChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-combobox
                                        label="District"
                                        value={selectedDistrict}
                                        options={districtOptions}
                                        onchange={handleDistrictChange}
                                    ></lightning-combobox>
                                </div>
                            </div>

                            <div class="kpi-row">
                                <template for:each={kpiRings} for:item="ring">
                                    <div key={ring.id} class="kpi-card">
                                        <div class="kpi-ring">
                                            <svg class="kpi-ring-svg" viewBox="0 0 52 52" aria-hidden="true">
                                                <circle class="kpi-ring-bg" cx="26" cy="26" r="22"></circle>
                                                <circle class={ring.ringClass} cx="26" cy="26" r="22" style={ring.ringStroke}></circle>
                                            </svg>
                                            <span class="kpi-ring-value">{ring.value}</span>
                                        </div>
                                        <span class="kpi-label">{ring.label}</span>
                                    </div>
                                </template>
                                <div class="kpi-card kpi-card-stat">
                                    <div class="stat-value">{coachingSummary.days}</div>
                                    <span class="kpi-label">Coaching Days</span>
                                </div>
                                <div class="kpi-card kpi-card-stat">
                                    <div class="stat-value">{coachingSummary.repsCoached}</div>
                                    <span class="kpi-label">Reps Coached</span>
                                </div>
                            </div>

                            <section class="product-performance-section">
                                <div class="section-heading product-performance-heading">
                                    <div>
                                        <h3 class="section-title">Product Performance Chart</h3>
                                        <p class="section-hint">All aligned products in {selectedBuName} — visits, CLM usage, and HCP feedback (MTD)</p>
                                    </div>
                                    <lightning-combobox
                                        label="Sort by"
                                        value={productSort}
                                        options={productSortOptions}
                                        onchange={handleProductSortChange}
                                        class="product-sort"
                                    ></lightning-combobox>
                                </div>

                                <template if:true={isProductLoading}>
                                    <div class="exec-loading compact">
                                        <lightning-spinner alternative-text="Loading product performance" size="small"></lightning-spinner>
                                    </div>
                                </template>

                                <template if:false={isProductLoading}>
                                    <template if:true={hasProductPerformance}>
                                        <div class="product-performance-grid">
                                            <template for:each={productPerformanceRows} for:item="product">
                                                <article key={product.productId} class={product.cardClass}>
                                                    <template if:true={product.topBadge}>
                                                        <span class={product.badgeClass}>{product.topBadge}</span>
                                                    </template>
                                                    <div class="product-image-wrap">
                                                        <c-product-thumbnail
                                                            image-url={product.imageUrl}
                                                            product-name={product.productName}
                                                            size="lg"
                                                        ></c-product-thumbnail>
                                                    </div>
                                                    <h4 class="product-performance-name">{product.productName}</h4>
                                                    <template if:true={product.hasMeta}>
                                                        <p class="product-performance-meta">{product.metaLabel}</p>
                                                    </template>
                                                    <div class="performance-bar-track">
                                                        <div class="performance-bar-fill" style={product.visitBarStyle}></div>
                                                    </div>
                                                    <div class="product-performance-stats">
                                                        <div class="product-stat">
                                                            <span class="product-stat-value">{product.visitCount}</span>
                                                            <span class="product-stat-label">Visits</span>
                                                        </div>
                                                        <div class="product-stat">
                                                            <span class="product-stat-value">{product.clmSessionCount}</span>
                                                            <span class="product-stat-label">CLM</span>
                                                        </div>
                                                        <div class="product-stat">
                                                            <span class="product-stat-value">{product.positiveDisplay}</span>
                                                            <span class="product-stat-label">Positive</span>
                                                        </div>
                                                    </div>
                                                    <p class="product-sentiment">{product.sentimentSummary}</p>
                                                </article>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={hasProductPerformance}>
                                        <p class="section-hint">No territory-aligned products found for this scope.</p>
                                    </template>
                                </template>
                            </section>

                            <template if:true={isDrillLoading}>
                                <div class="exec-loading compact">
                                    <lightning-spinner alternative-text="Loading drill-down" size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template if:false={isDrillLoading}>
                                <template if:true={hasDrillDown}>
                                    <div class="drill-table-wrap">
                                        <table class="drill-table">
                                            <thead>
                                                <tr>
                                                    <th>Name</th>
                                                    <th>Level</th>
                                                    <th>Coverage</th>
                                                    <th>Call Rate</th>
                                                    <th>KOL</th>
                                                    <th>Coaching Days</th>
                                                    <th>Salary</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={drillDownRows} for:item="row">
                                                    <tr key={row.key} class={row.rowClass}>
                                                        <td>
                                                            <div class="drill-name-cell" style={row.indentStyle}>
                                                                <template if:true={row.hasChildren}>
                                                                    <button
                                                                        type="button"
                                                                        class="drill-toggle"
                                                                        data-key={row.key}
                                                                        onclick={handleToggleRow}
                                                                        aria-label="Toggle row"
                                                                    >
                                                                        <lightning-icon icon-name={row.toggleIcon} size="xx-small"></lightning-icon>
                                                                    </button>
                                                                </template>
                                                                <template if:false={row.hasChildren}>
                                                                    <span class="drill-spacer"></span>
                                                                </template>
                                                                <span>{row.label}</span>
                                                            </div>
                                                        </td>
                                                        <td>{row.level}</td>
                                                        <td>{row.coverageDisplay}</td>
                                                        <td>{row.callRateDisplay}</td>
                                                        <td>{row.kolDisplay}</td>
                                                        <td>{row.coachingDisplay}</td>
                                                        <td>{row.salaryDisplay}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <template if:false={hasDrillDown}>
                                    <p class="section-hint">No hierarchy rows found for the selected filters.</p>
                                </template>
                            </template>
                        </section>
                    </template>
                </template>

                <template if:false={hasBuData}>
                    <p class="section-hint">No business unit data is available yet.</p>
                </template>

                <p class="footer-note">
                    Use Project Management, Promo Budget, Cross-Dept Hub, and Mendix Integration tabs for strategic control.
                </p>
            </template>
        </div>
    </article>
</template>
