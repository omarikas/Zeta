<template>
    <section class="ratings-capture">
        <header class="ratings-header">
            <h4>Ratings</h4>
        </header>

        <template if:true={hasLayout}>
            <c-rating-form-renderer
                layout-json={layoutJson}
                values-json={valuesJson}
                section-filter="account,accountTerritory"
                show-section-headers
                onvaluechange={handleValueChange}
            ></c-rating-form-renderer>

            <template if:true={hasAlignedProducts}>
                <h5 class="product-heading">Product Ratings</h5>
                <template for:each={alignedProducts} for:item="product">
                    <article key={product.product2Id} class="product-rating-row">
                        <div class="product-row-header">
                            <c-product-thumbnail
                                image-url={product.imageUrl}
                                product-name={product.productName}
                                size="md"
                            ></c-product-thumbnail>
                            <h5 class="product-row-title">{product.productName}</h5>
                        </div>
                        <c-rating-form-renderer
                            data-product-id={product.product2Id}
                            layout-json={layoutJson}
                            values-json={product.valuesJson}
                            section-filter="accountTerritoryProduct"
                            show-section-headers={productShowSectionHeaders}
                            onvaluechange={handleProductValueChange}
                        ></c-rating-form-renderer>
                    </article>
                </template>
            </template>

            <footer class="ratings-actions">
                <lightning-button
                    label="Save Ratings"
                    variant="brand"
                    onclick={handleSave}
                    disabled={isSaving}
                ></lightning-button>
            </footer>
        </template>
        <template if:false={hasLayout}>
            <p class="empty">No deployed rating layout configured.</p>
        </template>
    </section>
</template>
