<template>
    <div class="slds-table_container">
        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
            <thead>
                <tr class="slds-line-height_reset">
                    <template for:each={headerColumns} for:item="col">
                        <th key={col.fieldName} class="slds-text-title_caps" scope="col">
                            <div class="slds-truncate" title={col.label}>{col.label}</div>
                        </th>
                    </template>
                </tr>
            </thead>
            <tbody>
                <template for:each={rows} for:item="row">
                    <tr key={row.keyValue}>
                        <template for:each={row.cells} for:item="cell">
                            <td key={cell.fieldName} class={cell.className}>
                                <div class="slds-truncate">
                                    <template if:true={cell.isUrl}>
                                        <a href="javascript:void(0);">{cell.urlLabel}</a>
                                    </template>
                                    <template if:false={cell.isUrl}>
                                        {cell.value}
                                    </template>
                                </div>
                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
        <template if:false={rows.length}>
            <div class="slds-text-align_center slds-text-color_weak slds-p-around_medium">No records to display.</div>
        </template>
    </div>
</template>
