<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0176d3" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Pharma Field" />
        <title>Pharma Field — Performance</title>
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icon.svg" />
    </head>
    <body>
        <header id="app-nav" class="app-nav" hidden>
            <div class="nav-left">
                <div class="nav-brand">
                    <span class="nav-title">Pharma Field</span>
                    <span class="nav-badge">PWA</span>
                </div>
                <nav class="nav-tabs" role="tablist">
                    <button id="tab-btn-home" class="nav-tab nav-tab-active" type="button" role="tab" data-tab="home" aria-selected="true">
                        🏠 Home
                    </button>
                    <button id="tab-btn-accounts" class="nav-tab" type="button" role="tab" data-tab="accounts" aria-selected="false">
                        🏢 Accounts
                    </button>
                        <button id="tab-btn-planner" class="nav-tab" type="button" role="tab" data-tab="planner" aria-selected="false">
                            📅 Field Rep Planner
                        </button>
                        <button id="tab-btn-visits" class="nav-tab" type="button" role="tab" data-tab="visits" aria-selected="false">
                            📋 Visits
                        </button>
                </nav>
            </div>
            <div class="nav-actions">
                <button id="logout-btn" class="nav-btn-logout" type="button" title="Log out and clear access token">
                    Log out
                </button>
            </div>
        </header>

        <div id="session-bar" class="session-bar" hidden>
            <div class="session-form">
                <h2>Sign in to Salesforce</h2>
                <button id="login-btn" class="login-btn" type="button">
                    Sign in with Salesforce
                </button>
                <p class="session-hint">
                    Click to sign in with your Salesforce credentials. The PWA calls
                    <code>/services/apexrest/planner/v1/home/dashboard</code>,
                    <code>/services/apexrest/planner/v1/home/today-plan</code>,
                    <code>/services/apexrest/planner/v1/home/next-best-customers</code>,
                    and
                    <code>/services/apexrest/planner/v1/week</code>.
                </p>
            </div>
        </div>
        <main id="app" class="app-shell">
            <div id="view-home" class="view-panel active"></div>
            <div id="view-accounts" class="view-panel"></div>
            <div id="view-planner" class="view-panel"></div>
            <div id="view-visits" class="view-panel"></div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav" id="bottom-nav" hidden>
            <button class="bottom-nav-item active" data-tab="home" type="button">
                <span class="nav-glyph">🏠</span>
                <span class="nav-label">Home</span>
            </button>
            <button class="bottom-nav-item" data-tab="accounts" type="button">
                <span class="nav-glyph">🏢</span>
                <span class="nav-label">Accounts</span>
            </button>
            <button class="bottom-nav-item" data-tab="planner" type="button">
                <span class="nav-glyph">📅</span>
                <span class="nav-label">Planner</span>
            </button>
            <button class="bottom-nav-item" data-tab="visits" type="button">
                <span class="nav-glyph">📋</span>
                <span class="nav-label">Visits</span>
            </button>
        </nav>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
