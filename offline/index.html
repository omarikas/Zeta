<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0176d3" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Pharma Field" />
        <title>Pharma Field — Performance</title>
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icon.svg" />
    </head>
    <body>
        <header id="app-nav" class="app-nav" hidden>
            <div class="nav-brand">
                <span id="nav-title" class="nav-title">Pharma Field</span>
                <span class="nav-badge">v1.0.0</span>
            </div>
<nav id="app-tabs" class="nav-tabs" role="tablist"></nav>
            <div class="nav-actions nav-sidebar-actions">
                <button id="switch-app-btn" class="nav-btn-switch" type="button" title="Choose a different app">
                    Switch app
                </button>
                <button id="logout-btn" class="nav-btn-logout" type="button" title="Log out and clear access token">
                    Log out
                </button>
            </div>
        </header>

        <div id="session-bar" class="session-bar" hidden>
            <div class="session-form">
                <h2>Sign in to Salesforce</h2>
                <button id="login-btn" class="login-btn" type="button">
                    Sign in with Salesforce
                </button>
                <p class="session-hint">
                    Sign in with your Salesforce credentials, then choose which app to open.
                </p>
            </div>
        </div>

        <div id="app-chooser" class="app-chooser" hidden>
            <header class="chooser-head">
                <div>
                    <h1 class="chooser-title">App Launcher</h1>
                    <p class="chooser-sub">Open an app, or jump straight to an item. Pharma Field works fully offline.</p>
                </div>
                <button id="chooser-logout-btn" class="nav-btn-logout" type="button" title="Log out">
                    Log out
                </button>
            </header>
            <div class="chooser-search-wrap">
                <input id="chooser-search" class="chooser-search" type="search"
                    placeholder="Search apps and items…" autocomplete="off" autocorrect="off" />
            </div>
            <section class="chooser-section">
                <h2 class="chooser-section-title">All Apps</h2>
                <div id="app-chooser-grid" class="chooser-grid"></div>
            </section>
            <section class="chooser-section">
                <h2 class="chooser-section-title">All Items</h2>
                <div id="item-chooser-grid" class="chooser-grid chooser-grid-items"></div>
            </section>
        </div>
        <main id="app" class="app-shell">
            <div id="view-home" class="view-panel active"></div>
            <div id="view-accounts" class="view-panel"></div>
            <div id="view-planner" class="view-panel"></div>
            <div id="view-timeoff" class="view-panel"></div>
            <div id="view-clm" class="view-panel"></div>
            <div id="view-entity" class="view-panel"></div>
            <div id="view-unsupported" class="view-panel"></div>
        </main>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
